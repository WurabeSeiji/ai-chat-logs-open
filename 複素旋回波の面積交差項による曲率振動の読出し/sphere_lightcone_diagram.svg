<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6600"/>
    </marker>
    <marker id="arrowhead-orange2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6600"/>
    </marker>
    <marker id="arrowhead-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0099cc"/>
    </marker>
  </defs>

  <!-- 左図：3次元球面 -->
  <g id="sphere-section">
    <!-- 背景 -->
    <rect x="10" y="10" width="280" height="280" fill="url(#grid)"/>

    <!-- 軸 -->
    <line x1="30" y1="150" x2="270" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="150" y1="30" x2="150" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- 球面（円で表現） -->
    <circle cx="150" cy="150" r="80" fill="none" stroke="#0066cc" stroke-width="3"/>
    <circle cx="150" cy="150" r="80" fill="#0066cc" fill-opacity="0.05"/>

    <!-- 半径 R の矢印と表示 -->
    <line x1="150" y1="150" x2="230" y2="150" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
    <text x="190" y="140" font-size="14" font-weight="bold" fill="#ff6600">R</text>

    <!-- 軸ラベル -->
    <text x="260" y="165" font-size="12" fill="#666">x</text>
    <text x="160" y="25" font-size="12" fill="#666">y</text>

    <!-- タイトル -->
    <text x="150" y="295" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">実空間：3次元球面</text>

    <!-- 方程式 -->
    <text x="150" y="315" font-size="12" text-anchor="middle" fill="#0066cc" font-weight="bold">x² + y² + z² = R²</text>
  </g>

  <!-- 中央：矢印と置換 -->
  <g id="transformation">
    <text x="300" y="140" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">R' = iR</text>
    <text x="300" y="160" font-size="12" text-anchor="middle" fill="#666">↓</text>
    <text x="300" y="180" font-size="11" text-anchor="middle" fill="#666">(複素置換)</text>
  </g>

  <!-- 右図：2次元光円錐 -->
  <g id="lightcone-section">
    <!-- 背景 -->
    <rect x="320" y="10" width="280" height="280" fill="url(#grid)"/>

    <!-- 軸 -->
    <line x1="340" y1="150" x2="580" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="460" y1="30" x2="460" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- 光円錐（90度回転した X、ヌル線） -->
    <line x1="380" y1="70" x2="540" y2="230" stroke="#cc0066" stroke-width="3"/>
    <line x1="540" y1="70" x2="380" y2="230" stroke="#cc0066" stroke-width="3"/>

    <!-- 塗りつぶし（錐体内部） -->
    <polygon points="460,150 380,70 460,30 540,70" fill="#cc0066" fill-opacity="0.05"/>
    <polygon points="460,150 540,230 460,270 380,230" fill="#cc0066" fill-opacity="0.05"/>

    <!-- iR の矢印と表示 -->
    <line x1="460" y1="150" x2="460" y2="70" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead-orange2)"/>
    <text x="475" y="100" font-size="14" font-weight="bold" fill="#ff6600">iR</text>

    <!-- r の矢印と表示 -->
    <line x1="460" y1="150" x2="540" y2="150" stroke="#0099cc" stroke-width="2" marker-end="url(#arrowhead-cyan)"/>
    <text x="500" y="165" font-size="14" font-weight="bold" fill="#0099cc">r</text>

    <!-- 軸ラベル -->
    <text x="570" y="165" font-size="12" fill="#666">r (実)</text>
    <text x="465" y="25" font-size="12" fill="#666">iR (虚)</text>

    <!-- タイトル -->
    <text x="460" y="295" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">複素空間：2次元光円錐</text>

    <!-- 方程式 -->
    <text x="460" y="315" font-size="12" text-anchor="middle" fill="#cc0066" font-weight="bold">r² + (iR)² = 0</text>
  </g>
</svg>