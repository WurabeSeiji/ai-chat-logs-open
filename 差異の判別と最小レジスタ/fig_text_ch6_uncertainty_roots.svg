<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Two roots of uncertainty</title>
  <desc id="desc">Root 1 is the indivisible beat cell. Root 2 is the fiber created by a non-injective readout. Born-type readout reaches square intensity and induced measure, not frequency postulates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .soft { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .cell { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
      .fiber { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.4; }
      .measure { fill: #dcfce7; stroke: #059669; stroke-width: 1.4; }
      .axis { stroke: #64748b; stroke-width: 1.2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .em { font-weight: 700; fill: #0f172a; }
      .red { fill: #b91c1c; font-weight: 700; }
      .blue { fill: #1d4ed8; font-weight: 700; }
      .green { fill: #047857; font-weight: 700; }
    </style>
  </defs>

  <rect width="1040" height="520" class="bg"/>
  <text x="520" y="34" text-anchor="middle" class="title">Uncertainty has two roots: cell outside, fiber inside</text>

  <rect x="34" y="64" width="464" height="398" rx="10" class="panel"/>
  <rect x="542" y="64" width="464" height="398" rx="10" class="panel"/>

  <text x="266" y="94" text-anchor="middle" class="title">root 1: beat cell</text>
  <text x="774" y="94" text-anchor="middle" class="title">root 2: readout fiber</text>

  <rect x="80" y="128" width="330" height="220" rx="8" class="soft"/>
  <line x1="108" y1="314" x2="382" y2="314" class="axis"/>
  <line x1="108" y1="314" x2="108" y2="154" class="axis"/>
  <text x="384" y="334" text-anchor="end" class="small">u</text>
  <text x="90" y="158" text-anchor="end" class="small">nu</text>
  <g>
    <line x1="158" y1="154" x2="158" y2="314" class="grid"/>
    <line x1="208" y1="154" x2="208" y2="314" class="grid"/>
    <line x1="258" y1="154" x2="258" y2="314" class="grid"/>
    <line x1="308" y1="154" x2="308" y2="314" class="grid"/>
    <line x1="358" y1="154" x2="358" y2="314" class="grid"/>
    <line x1="108" y1="194" x2="382" y2="194" class="grid"/>
    <line x1="108" y1="234" x2="382" y2="234" class="grid"/>
    <line x1="108" y1="274" x2="382" y2="274" class="grid"/>
  </g>
  <rect x="208" y="194" width="50" height="40" class="cell"/>
  <rect x="258" y="194" width="50" height="40" class="cell" opacity="0.55"/>
  <rect x="208" y="234" width="50" height="40" class="cell" opacity="0.55"/>
  <text x="233" y="218" text-anchor="middle" class="blue">1 tick</text>
  <path d="M 232 194 C 208 168, 262 168, 258 194" class="arrow"/>
  <text x="234" y="154" text-anchor="middle" class="small">relative phase slip 2pi</text>
  <text x="244" y="374" text-anchor="middle" class="em">Delta u * Delta nu >= 1 cell</text>
  <text x="244" y="398" text-anchor="middle" class="small">fractions below a completed beat are not records</text>

  <circle cx="690" cy="210" r="72" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="690" cy="210" r="5" fill="#111827"/>
  <path d="M 690 210 L 762 210" stroke="#2563eb" stroke-width="3"/>
  <path d="M 690 210 L 646 153" stroke="#059669" stroke-width="3"/>
  <path d="M 690 210 L 642 264" stroke="#dc2626" stroke-width="3"/>
  <path d="M 762 210 C 825 204, 835 204, 876 206" class="arrow"/>
  <circle cx="904" cy="206" r="34" class="measure"/>
  <text x="904" y="211" text-anchor="middle" class="small">|Z|^2</text>
  <path d="M 646 153 C 815 130, 838 163, 876 195" class="dash"/>
  <path d="M 642 264 C 812 284, 842 247, 876 217" class="dash"/>
  <text x="690" y="306" text-anchor="middle" class="red">S1 fiber: all phases fold to one value</text>

  <rect x="610" y="348" width="328" height="70" rx="8" class="soft"/>
  <text x="774" y="374" text-anchor="middle" class="em">Born-type boundary</text>
  <text x="774" y="398" text-anchor="middle" class="small">algebra gives square intensity + induced measure</text>
  <text x="774" y="416" text-anchor="middle" class="small">frequency/probability postulate remains outside</text>
</svg>
