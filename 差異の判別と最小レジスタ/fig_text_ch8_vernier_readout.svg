<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">第8章 図1 物差しと副尺による読出し面</title>
  <desc id="desc">親尺と副尺の目盛り間隔のわずかな差を使い、どの線が一致するかを読む図。細かい値を直接覗くのではなく、一致イベントとして記録する。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#273043"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c33d3d"/>
    </marker>
    <style>
      text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; fill: #273043; }
      .title { font-size: 34px; font-weight: 700; }
      .mid { font-size: 28px; font-weight: 600; }
      .small { font-size: 23px; }
      .note { font-size: 20px; fill: #4d5666; }
      .main { stroke: #273043; stroke-width: 6; stroke-linecap: round; }
      .vernier { stroke: #1f6f8b; stroke-width: 6; stroke-linecap: round; }
      .tick { stroke: #273043; stroke-width: 4; }
      .vtick { stroke: #1f6f8b; stroke-width: 4; }
      .minor { stroke-width: 2.4; }
      .coincide { stroke: #c33d3d; stroke-width: 6; stroke-linecap: round; }
      .dash { stroke: #c33d3d; stroke-width: 4; stroke-dasharray: 9 9; fill: none; }
      .panel { fill: #ffffff; stroke: #d7dce2; stroke-width: 2; rx: 8; }
      .soft { fill: #eef7fa; stroke: #c8e7ef; stroke-width: 2; rx: 8; }
      .warm { fill: #fff4f1; stroke: #efc8bd; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#fbfaf6"/>

  <text x="64" y="58" class="title">物差し（ゲージ）と副尺による読出し</text>
  <text x="64" y="92" class="note">ここでの「ゲージ」は測定器・物差しの意味であり、後のゲージ理論のゲージではない。</text>

  <rect x="78" y="126" width="430" height="116" class="panel"/>
  <text x="104" y="166" class="mid">親尺</text>
  <text x="104" y="205" class="small">読み手台帳の基準目盛り</text>
  <text x="104" y="232" class="note">粗い目盛りだけでは端数は直接読めない。</text>

  <rect x="720" y="126" width="400" height="116" class="soft"/>
  <text x="746" y="166" class="mid">副尺</text>
  <text x="746" y="205" class="small">対象側のずれを持つ目盛り</text>
  <text x="746" y="232" class="note">目盛り間隔が少しだけ違う。</text>

  <line x1="120" y1="300" x2="1080" y2="300" class="main"/>
  <text x="122" y="284" class="small">親尺</text>

  <line x1="240" y1="430" x2="960" y2="430" class="vernier"/>
  <text x="242" y="470" class="small" fill="#1f6f8b">副尺</text>

  <g>
    <line x1="120" y1="300" x2="120" y2="242" class="tick"/>
    <line x1="200" y1="300" x2="200" y2="266" class="tick minor"/>
    <line x1="280" y1="300" x2="280" y2="242" class="tick"/>
    <line x1="360" y1="300" x2="360" y2="266" class="tick minor"/>
    <line x1="440" y1="300" x2="440" y2="242" class="tick"/>
    <line x1="520" y1="300" x2="520" y2="266" class="tick minor"/>
    <line x1="600" y1="300" x2="600" y2="242" class="tick"/>
    <line x1="680" y1="300" x2="680" y2="266" class="tick minor"/>
    <line x1="760" y1="300" x2="760" y2="242" class="tick"/>
    <line x1="840" y1="300" x2="840" y2="266" class="tick minor"/>
    <line x1="920" y1="300" x2="920" y2="242" class="tick"/>
    <line x1="1000" y1="300" x2="1000" y2="266" class="tick minor"/>
    <line x1="1080" y1="300" x2="1080" y2="242" class="tick"/>
  </g>

  <g>
    <line x1="240" y1="430" x2="240" y2="488" class="vtick"/>
    <line x1="312" y1="430" x2="312" y2="464" class="vtick minor"/>
    <line x1="384" y1="430" x2="384" y2="488" class="vtick"/>
    <line x1="456" y1="430" x2="456" y2="464" class="vtick minor"/>
    <line x1="528" y1="430" x2="528" y2="488" class="vtick"/>
    <line x1="600" y1="430" x2="600" y2="488" class="vtick"/>
    <line x1="672" y1="430" x2="672" y2="464" class="vtick minor"/>
    <line x1="744" y1="430" x2="744" y2="488" class="vtick"/>
    <line x1="816" y1="430" x2="816" y2="464" class="vtick minor"/>
    <line x1="888" y1="430" x2="888" y2="488" class="vtick"/>
    <line x1="960" y1="430" x2="960" y2="464" class="vtick minor"/>
  </g>

  <line x1="600" y1="238" x2="600" y2="500" class="coincide"/>
  <circle cx="600" cy="300" r="12" fill="#c33d3d"/>
  <circle cx="600" cy="430" r="12" fill="#c33d3d"/>
  <text x="628" y="356" class="mid" fill="#c33d3d">コインシデンス</text>
  <text x="628" y="390" class="small">二つの線が同じ読出し面で一致する</text>

  <path d="M 120 546 C 170 522 190 522 240 546" class="dash" marker-end="url(#redArrow)"/>
  <text x="116" y="588" class="small">親尺0と副尺0のずれ</text>
  <text x="116" y="620" class="small">= 位相差・端数の入口</text>

  <rect x="710" y="520" width="390" height="106" class="warm"/>
  <text x="736" y="558" class="mid">読むもの</text>
  <text x="736" y="596" class="small">細かい値そのものではない。</text>
  <text x="736" y="624" class="small">差が作る一致位置を記録する。</text>
</svg>
