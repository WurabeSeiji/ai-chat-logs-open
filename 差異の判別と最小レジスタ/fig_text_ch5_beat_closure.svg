<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Beat scale and closure master counter</title>
  <desc id="desc">Two coherent frequencies create a beat whose tick is a 2 pi relative phase slip. The minimal nontrivial closure a squared plus b squared equals c squared makes c the master counter.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .band { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #64748b; stroke-width: 1.2; }
      .wave1 { fill: none; stroke: #2563eb; stroke-width: 2.4; }
      .wave2 { fill: none; stroke: #059669; stroke-width: 2.4; }
      .beat { fill: none; stroke: #dc2626; stroke-width: 3; }
      .env { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 5; }
      .tri-a { stroke: #2563eb; stroke-width: 5; }
      .tri-b { stroke: #059669; stroke-width: 5; }
      .tri-c { stroke: #dc2626; stroke-width: 5; }
      .link { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow-slate); }
      .beat-link { stroke: #dc2626; stroke-width: 2.4; fill: none; marker-end: url(#arrow-slate); stroke-dasharray: 6 5; }
      .dot { fill: #111827; }
      .tick { stroke: #0f172a; stroke-width: 1.3; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .formula { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .red { fill: #b91c1c; font-weight: 700; }
      .blue { fill: #1d4ed8; font-weight: 700; }
      .green { fill: #047857; font-weight: 700; }
    </style>
  </defs>

  <rect width="1040" height="520" fill="#ffffff"/>
  <text x="520" y="32" text-anchor="middle" class="title">A readable scale is a beat; a nontrivial closure supplies the beat pair</text>

  <rect x="34" y="62" width="604" height="404" rx="10" class="panel"/>
  <rect x="672" y="62" width="334" height="404" rx="10" class="panel"/>

  <text x="336" y="91" text-anchor="middle" class="title">two coherent rates -> beat ticks</text>
  <text x="839" y="91" text-anchor="middle" class="title">minimal closure</text>

  <rect x="66" y="118" width="540" height="250" rx="8" class="band"/>
  <line x1="82" y1="208" x2="590" y2="208" class="axis"/>
  <line x1="82" y1="288" x2="590" y2="288" class="axis"/>
  <text x="76" y="113" class="small">external drawing parameter u</text>

  <path class="wave1" d="M 82.0 208.0 L 93.0 182.9 L 104.0 171.7 L 115.0 190.6 L 126.0 218.7 L 137.0 236.7 L 148.0 223.6 L 159.0 195.2 L 170.0 172.2 L 181.0 179.1 L 192.0 206.7 L 203.0 233.5 L 214.0 233.4 L 225.0 206.6 L 236.0 179.1 L 247.0 172.3 L 258.0 195.3 L 269.0 223.7 L 280.0 236.6 L 291.0 218.5 L 302.0 190.4 L 313.0 171.8 L 324.0 183.1 L 335.0 208.2 L 346.0 233.1 L 357.0 244.1 L 368.0 224.9 L 379.0 196.8 L 390.0 179.1 L 401.0 192.5 L 412.0 220.8 L 423.0 243.5 L 434.0 236.3 L 445.0 208.6 L 456.0 182.0 L 467.0 182.4 L 478.0 209.3 L 489.0 236.5 L 500.0 242.9 L 511.0 219.6 L 522.0 191.3 L 533.0 178.7 L 544.0 197.2 L 555.0 225.2 L 566.0 243.5 L 577.0 232.0 L 588.0 206.7"/>
  <path class="wave2" d="M 82.0 288.0 L 93.0 264.1 L 104.0 249.0 L 115.0 259.7 L 126.0 284.5 L 137.0 306.5 L 148.0 308.5 L 159.0 288.8 L 170.0 263.2 L 181.0 248.5 L 192.0 259.9 L 203.0 285.0 L 214.0 306.7 L 225.0 308.0 L 236.0 287.7 L 247.0 262.4 L 258.0 248.0 L 269.0 260.3 L 280.0 285.6 L 291.0 307.0 L 302.0 307.5 L 313.0 286.8 L 324.0 261.6 L 335.0 247.7 L 346.0 260.8 L 357.0 286.2 L 368.0 307.2 L 379.0 306.9 L 390.0 285.8 L 401.0 260.9 L 412.0 247.5 L 423.0 261.3 L 434.0 286.9 L 445.0 307.4 L 456.0 306.2 L 467.0 284.9 L 478.0 260.3 L 489.0 247.3 L 500.0 262.0 L 511.0 287.5 L 522.0 307.5 L 533.0 305.5 L 544.0 284.0 L 555.0 259.7 L 566.0 247.3 L 577.0 262.7 L 588.0 288.2"/>

  <path class="env" d="M 82 152 C 146 118 208 118 272 152 C 336 186 400 186 464 152 C 528 118 558 118 590 132"/>
  <path class="env" d="M 82 344 C 146 378 208 378 272 344 C 336 310 400 310 464 344 C 528 378 558 378 590 364"/>
  <path class="beat" d="M 82 248 C 146 141 208 141 272 248 C 336 355 400 355 464 248 C 528 141 558 141 590 188"/>

  <line x1="272" y1="126" x2="272" y2="370" class="tick"/>
  <line x1="464" y1="126" x2="464" y2="370" class="tick"/>
  <text x="368" y="394" text-anchor="middle" class="formula">1 tick = relative phase slip 2π</text>
  <text x="226" y="170" class="label"><tspan class="blue">nu1</tspan> and <tspan class="green">nu2</tspan> are both present</text>
  <text x="160" y="424" class="small" text-anchor="middle">time reading: beat</text>
  <text x="336" y="424" class="small" text-anchor="middle">space reading: fringe</text>
  <text x="520" y="424" class="small" text-anchor="middle">count coincidences, not delay</text>

  <text x="839" y="130" text-anchor="middle" class="formula">a² + b² + (ic)² = 0</text>
  <text x="839" y="156" text-anchor="middle" class="formula">a² + b² = c²</text>

  <line x1="748" y1="354" x2="918" y2="354" class="tri-a"/>
  <line x1="748" y1="354" x2="748" y2="214" class="tri-b"/>
  <line x1="748" y1="214" x2="918" y2="354" class="tri-c"/>
  <circle cx="748" cy="354" r="5" class="dot"/>
  <circle cx="918" cy="354" r="5" class="dot"/>
  <circle cx="748" cy="214" r="5" class="dot"/>
  <text x="832" y="377" text-anchor="middle" class="label"><tspan class="blue">a</tspan></text>
  <text x="725" y="286" text-anchor="middle" class="label"><tspan class="green">b</tspan></text>
  <text x="848" y="272" text-anchor="middle" class="label"><tspan class="red">c = master</tspan></text>

  <path d="M 900 205 C 938 232 948 276 924 315" class="beat-link"/>
  <text x="884" y="200" class="small">c vs a,b</text>
  <text x="722" y="413" class="label">closure supplies:</text>
  <text x="722" y="438" class="small">pair / difference / coherence</text>
</svg>
