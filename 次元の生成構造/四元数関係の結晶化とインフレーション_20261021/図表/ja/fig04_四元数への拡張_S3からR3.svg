<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo','Hiragino Sans',sans-serif">
<defs><marker id="a1f5fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fa8"/></marker><marker id="ab03030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b03030"/></marker></defs>
<rect width="920" height="520" fill="#fff"/>
<text x="460" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">図4　四元数への拡張：S³ の相対位相を R³ へ射影する</text>
<circle cx="230" cy="290" r="150" stroke="#222" fill="none" stroke-width="1.5"/>
<ellipse cx="230" cy="290" rx="150" ry="41.3" stroke="#888" fill="#f3f6fa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="230" y1="434.2" x2="334.2" y2="193.5" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="230" y1="290" x2="298.1" y2="276.9" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/>
<circle cx="230" cy="145.8" r="5" fill="#2e7d32"/>
<text x="240" y="139.8" font-size="13" text-anchor="start" fill="#2e7d32" font-weight="normal">u = +1（観測者）</text>
<circle cx="230" cy="434.2" r="5" fill="#222"/>
<text x="240" y="452.2" font-size="13" text-anchor="start" fill="#222" font-weight="normal">u = −1（射影の極）</text>
<circle cx="334.2" cy="193.5" r="5" fill="#222"/>
<text x="342.2" y="185.5" font-size="13" text-anchor="start" fill="#222" font-weight="normal">u = q<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-9.6" font-size="9.4">−1</tspan><tspan dy="5.4">q</tspan><tspan dy="4.2" font-size="9.4">2</tspan></text>
<circle cx="230" cy="290" r="5" fill="#2e7d32"/>
<text x="180" y="306" font-size="13" text-anchor="start" fill="#2e7d32" font-weight="normal">k = 0</text>
<text x="306.1" y="294.9" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">k = −n tan(α/2)</text>
<text x="80" y="476" font-size="12" text-anchor="start" fill="#888" font-weight="normal">S³ を 1 次元省略して S² で表示。赤道面 = R³（純虚四元数）</text>
<circle cx="600" cy="200" r="100" stroke="#ccc" fill="none" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="600" y1="200" x2="694" y2="165.8" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/>
<line x1="600" y1="200" x2="620.8" y2="102.2" stroke="#b03030" stroke-width="3" marker-end="url(#ab03030)"/>
<circle cx="600" cy="200" r="4" fill="#222"/>
<text x="700" y="169.8" font-size="13" text-anchor="start" fill="#1f5fa8" font-weight="normal">n（左：q<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-9.6" font-size="9.4">−1</tspan><tspan dy="5.4">q</tspan><tspan dy="4.2" font-size="9.4">2</tspan><tspan dy="-4.2">）</tspan></text>
<text x="626.8" y="98.2" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">q<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2"> n q</tspan><tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-9.6" font-size="9.4">−1</tspan><tspan dy="5.4">（右：q</tspan><tspan dy="4.2" font-size="9.4">2</tspan><tspan dy="-4.2">q</tspan><tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-9.6" font-size="9.4">−1</tspan><tspan dy="5.4">）</tspan></text>
<text x="500" y="335" font-size="13" text-anchor="start" fill="#222" font-weight="normal">長さ |k| = tan(α/2) は共通（観測枠によらない）</text>
<text x="500" y="353.9" font-size="13" text-anchor="start" fill="#222" font-weight="normal">方向 n は観測枠に依存（q<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2"> による共役で回転）</tspan></text>
<rect x="480" y="390" width="420" height="90" rx="8" stroke="#222" fill="#fafafa" stroke-width="1"/>
<text x="496" y="416" font-size="13" text-anchor="start" fill="#222" font-weight="normal">振幅が異なるとき（u = ρ e<tspan dy="-5.4" font-size="9.4">nα</tspan><tspan dy="5.4">）</tspan></text>
<text x="496" y="434.9" font-size="13" text-anchor="start" fill="#222" font-weight="normal">k = [(1−ρ²) − 2 Im u] / |1+u|²</text>
<text x="496" y="453.7" font-size="13" text-anchor="start" fill="#222" font-weight="normal">スカラー部：振幅の不整合　ベクトル部：向きをもつ位相結合</text>
</svg>
