<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo','Hiragino Sans',sans-serif">
<defs><marker id="ab03030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b03030"/></marker></defs>
<rect width="920" height="820" fill="#fff"/>
<text x="460" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">図1　研究の経緯：行き詰まりが次の段階を強制する連鎖</text>
<rect x="40" y="56" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="86" font-size="16" text-anchor="start" fill="#222" font-weight="bold">① 中心投影（グノモン射影）と Σx<tspan dy="5.1" font-size="11.5">n</tspan><tspan dy="-5.1">² = R²</tspan></text>
<text x="56" y="112" font-size="13" text-anchor="start" fill="#444" font-weight="normal">曲率半径 R が光円錐と接続される可能性</text>
<line x1="290" y1="130" x2="290" y2="162" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="134" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">Σx<tspan dy="4.2" font-size="9.4">n</tspan><tspan dy="-4.2">² = 0 は実数では自明解のみ</tspan></text>
<text x="564" y="152.8" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">→ 複素数 z<tspan dy="4.2" font-size="9.4">n</tspan><tspan dy="-4.2"> が必要</tspan></text>
<rect x="40" y="164" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="194" font-size="16" text-anchor="start" fill="#222" font-weight="bold">② 無名複素ゼロ閉塞 Σz<tspan dy="5.1" font-size="11.5">n</tspan><tspan dy="-5.1">² = 0</tspan></text>
<text x="56" y="220" font-size="13" text-anchor="start" fill="#444" font-weight="normal">複素ヒルベルト空間（清水『新版 量子論の基礎』）</text>
<line x1="290" y1="238" x2="290" y2="270" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="242" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">四次元時空が背景として外から置かれ、</text>
<text x="564" y="260.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">進行位相 ωt が暗黙に持ち込まれている</text>
<rect x="40" y="272" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="302" font-size="16" text-anchor="start" fill="#222" font-weight="bold">③ x²+y²+z²+t² = R²+Q<tspan dy="5.1" font-size="11.5">1</tspan><tspan dy="-5.1">²+Q</tspan><tspan dy="5.1" font-size="11.5">2</tspan><tspan dy="-5.1">²+Q</tspan><tspan dy="5.1" font-size="11.5">3</tspan><tspan dy="-5.1">² と無名性</tspan></text>
<text x="56" y="328" font-size="13" text-anchor="start" fill="#444" font-weight="normal">ラベルは読み出し後に付けた名前</text>
<line x1="290" y1="346" x2="290" y2="378" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="350" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">{z<tspan dy="4.2" font-size="9.4">n</tspan><tspan dy="-4.2">} そのものには構造がなく、</tspan></text>
<text x="564" y="368.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">四次元時空を自律的に読み出せない</text>
<rect x="40" y="380" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="410" font-size="16" text-anchor="start" fill="#222" font-weight="bold">④ 完全ネットワーク（複素シンプレックス）</text>
<text x="56" y="436" font-size="13" text-anchor="start" fill="#444" font-weight="normal">関係の数 M = N(N−1)/2</text>
<line x1="290" y1="454" x2="290" y2="486" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="458" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">関係（どの頂点とどの頂点か）を</text>
<text x="564" y="476.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">外から与える → 無名性に違反</text>
<rect x="40" y="488" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="518" font-size="16" text-anchor="start" fill="#222" font-weight="bold">⑤ M² の自己相互作用</text>
<text x="56" y="544" font-size="13" text-anchor="start" fill="#444" font-weight="normal">高対称な集合で幾何級数的（インフレーション的）発展</text>
<line x1="290" y1="562" x2="290" y2="594" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="566" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">発展は得られたが、</text>
<text x="564" y="584.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">四次元時空が読み出せない</text>
<rect x="40" y="596" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="626" font-size="16" text-anchor="start" fill="#222" font-weight="bold">⑥ 四元数（単なる 4 次元ベクトル）</text>
<text x="56" y="652" font-size="13" text-anchor="start" fill="#444" font-weight="normal">無名性を破らず、非可換な積という構造をもつ</text>
<line x1="290" y1="670" x2="290" y2="702" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="674" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">構造を自律的に生む仕組みが必要</text>
<text x="564" y="692.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">→ 物性物理の結晶化に類似</text>
<rect x="40" y="704" width="500" height="74" rx="8" stroke="#1f5fa8" fill="#dce8f6" stroke-width="2"/>
<text x="56" y="734" font-size="16" text-anchor="start" fill="#222" font-weight="bold">⑦ 過冷却 ＋ シード → 結晶化（部分投射）</text>
<text x="56" y="760" font-size="13" text-anchor="start" fill="#444" font-weight="normal">本稿の主題：外から関係を与えない自律的な構造化</text>
<text x="564" y="734" font-size="12" text-anchor="start" fill="#888" font-weight="normal">（赤字＝その段の行き詰まり）</text>
</svg>
