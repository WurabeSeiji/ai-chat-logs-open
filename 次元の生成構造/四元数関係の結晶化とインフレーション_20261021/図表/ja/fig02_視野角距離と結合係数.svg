<text x="20" y="72" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">和（青）：|z<tspan dy="4.5" font-size="10.1">1</tspan><tspan dy="-4.5">+z</tspan><tspan dy="4.5" font-size="10.1">2</tspan><tspan dy="-4.5">| = 2r cos(Δθ/2)</tspan></text>
<text x="20" y="94" font-size="14" text-anchor="start" fill="#b03030" font-weight="normal">差（赤）：|z<tspan dy="4.5" font-size="10.1">1</tspan><tspan dy="-4.5">−z</tspan><tspan dy="4.5" font-size="10.1">2</tspan><tspan dy="-4.5">| = 2r sin(Δθ/2)</tspan></text>
<text x="20" y="520" font-size="12" text-anchor="start" fill="#888" font-weight="normal">等振幅 |z<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8">| = |z</tspan><tspan dy="3.8" font-size="8.6">2</tspan><tspan dy="-3.8">| = r。和と差の原点は O（R3）</tspan></text>
