<text x="669.5" y="360.5" font-size="12" text-anchor="start" fill="#222" font-weight="normal">直交：g = D = 1</text>
<text x="520" y="64" font-size="13" text-anchor="start" fill="#1f5fa8" font-weight="normal">g = |z<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2">−z</tspan><tspan dy="4.2" font-size="9.4">2</tspan><tspan dy="-4.2">| / |z</tspan><tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2">+z</tspan><tspan dy="4.2" font-size="9.4">2</tspan><tspan dy="-4.2">| = tan(Δθ/2)　結合係数＝近さ</tspan></text>
<text x="520" y="86" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">D = 1/g = cot(Δθ/2)　視野角距離</text>
<text x="480" y="470" font-size="12" text-anchor="start" fill="#222" font-weight="normal">同位相 Δθ→0：g→0, D→∞（作用なし・無限遠）</text>
<text x="480" y="489" font-size="12" text-anchor="start" fill="#222" font-weight="normal">逆位相 Δθ=π：g→∞, D=0（全反射・接触）</text>
<text x="480" y="508" font-size="12" text-anchor="start" fill="#222" font-weight="normal">分母は合成 |z<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8">+z</tspan><tspan dy="3.8" font-size="8.6">2</tspan><tspan dy="-3.8">|。読み出しの最後に一度だけ割る（R2）</tspan></text>
