<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo','Hiragino Sans',sans-serif">
<defs><marker id="ab03030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b03030"/></marker></defs>
<rect width="920" height="820" fill="#fff"/>
<text x="460" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">Fig. 1  Research history: each impasse forced the next stage</text>
<rect x="40" y="56" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="86" font-size="16" text-anchor="start" fill="#222" font-weight="bold">① Central (gnomonic) projection, Σx<tspan dy="5.1" font-size="11.5">n</tspan><tspan dy="-5.1">² = R²</tspan></text>
<text x="56" y="112" font-size="13" text-anchor="start" fill="#444" font-weight="normal">The curvature radius R may connect to the light cone</text>
<line x1="290" y1="130" x2="290" y2="162" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="134" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">Σx<tspan dy="4.2" font-size="9.4">n</tspan><tspan dy="-4.2">² = 0 has only the trivial solution</tspan></text>
<text x="564" y="152.8" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">over the reals → complex z<tspan dy="4.2" font-size="9.4">n</tspan><tspan dy="-4.2"> needed</tspan></text>
<rect x="40" y="164" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="194" font-size="16" text-anchor="start" fill="#222" font-weight="bold">② Anonymous complex zero closure Σz<tspan dy="5.1" font-size="11.5">n</tspan><tspan dy="-5.1">² = 0</tspan></text>
<text x="56" y="220" font-size="13" text-anchor="start" fill="#444" font-weight="normal">Complex Hilbert space (Shimizu, Foundations of QT)</text>
<line x1="290" y1="238" x2="290" y2="270" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="242" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">4D spacetime is put in from outside as a</text>
<text x="564" y="260.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">background; phase ωt enters implicitly</text>
<rect x="40" y="272" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="302" font-size="16" text-anchor="start" fill="#222" font-weight="bold">③ x²+y²+z²+t² = R²+Q<tspan dy="5.1" font-size="11.5">1</tspan><tspan dy="-5.1">²+Q</tspan><tspan dy="5.1" font-size="11.5">2</tspan><tspan dy="-5.1">²+Q</tspan><tspan dy="5.1" font-size="11.5">3</tspan><tspan dy="-5.1">², anonymity</tspan></text>
<text x="56" y="328" font-size="13" text-anchor="start" fill="#444" font-weight="normal">Labels are names attached after readout</text>
<line x1="290" y1="346" x2="290" y2="378" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="350" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">{z<tspan dy="4.2" font-size="9.4">n</tspan><tspan dy="-4.2">} itself has no structure; 4D spacetime</tspan></text>
<text x="564" y="368.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">cannot be read out autonomously</text>
<rect x="40" y="380" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="410" font-size="16" text-anchor="start" fill="#222" font-weight="bold">④ Complete network (complex simplex)</text>
<text x="56" y="436" font-size="13" text-anchor="start" fill="#444" font-weight="normal">Number of relations M = N(N−1)/2</text>
<line x1="290" y1="454" x2="290" y2="486" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="458" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">Relations (which vertex with which) must</text>
<text x="564" y="476.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">be given from outside → breaks anonymity</text>
<rect x="40" y="488" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="518" font-size="16" text-anchor="start" fill="#222" font-weight="bold">⑤ M² self-interaction</text>
<text x="56" y="544" font-size="13" text-anchor="start" fill="#444" font-weight="normal">Geometric (inflation-like) growth in a symmetric set</text>
<line x1="290" y1="562" x2="290" y2="594" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="566" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">Growth was obtained, but</text>
<text x="564" y="584.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">4D spacetime could not be read out</text>
<rect x="40" y="596" width="500" height="74" rx="8" stroke="#222" fill="#fff" stroke-width="1.5"/>
<text x="56" y="626" font-size="16" text-anchor="start" fill="#222" font-weight="bold">⑥ Quaternions (just 4-dimensional vectors)</text>
<text x="56" y="652" font-size="13" text-anchor="start" fill="#444" font-weight="normal">Anonymity kept; non-commutative product structure</text>
<line x1="290" y1="670" x2="290" y2="702" stroke="#b03030" stroke-width="2" marker-end="url(#ab03030)"/>
<text x="564" y="674" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">A mechanism generating structure by itself</text>
<text x="564" y="692.9" font-size="13" text-anchor="start" fill="#b03030" font-weight="normal">is needed → like crystallization</text>
<rect x="40" y="704" width="500" height="74" rx="8" stroke="#1f5fa8" fill="#dce8f6" stroke-width="2"/>
<text x="56" y="734" font-size="16" text-anchor="start" fill="#222" font-weight="bold">⑦ Supercooling + seed → crystallization</text>
<text x="56" y="760" font-size="13" text-anchor="start" fill="#444" font-weight="normal">This paper: autonomous structuring (partial projection)</text>
<text x="564" y="734" font-size="12" text-anchor="start" fill="#888" font-weight="normal">(red = the impasse at each stage)</text>
</svg>
