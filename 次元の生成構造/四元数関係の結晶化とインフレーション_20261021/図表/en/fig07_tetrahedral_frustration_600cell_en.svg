<text x="680" y="64" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">S³ (600-cell): dihedral 72° × 5 = 360°</text>
<text x="230" y="420" font-size="12" text-anchor="middle" fill="#888" font-weight="normal">Viewed along a shared edge (each sector = one tetrahedron)</text>
<text x="230" y="438" font-size="12" text-anchor="middle" fill="#888" font-weight="normal">Gap = unclosable part = defect line (deficit) = curvature</text>
<text x="680" y="420" font-size="12" text-anchor="middle" fill="#888" font-weight="normal">120 vertices = unit quaternions (binary icosahedral group)</text>
<text x="680" y="438" font-size="12" text-anchor="middle" fill="#888" font-weight="normal">600 regular tetrahedra exactly fill S³</text>
