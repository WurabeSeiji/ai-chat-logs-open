<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo','Hiragino Sans',sans-serif">
<defs><marker id="a222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
<rect width="920" height="560" fill="#fff"/>
<text x="460" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">Fig. 3  Circle of relative phase and two maps: coupling map k and distance map x</text>
<line x1="80" y1="330" x2="480" y2="330" stroke="#ccc" stroke-width="1"/>
<line x1="280" y1="510" x2="280" y2="60" stroke="#222" stroke-width="1.2" marker-end="url(#a222)"/>
<text x="288" y="70" font-size="12" text-anchor="start" fill="#888" font-weight="normal">Projection line (Re u = 0)</text>
<circle cx="280" cy="330" r="140" stroke="#222" fill="none" stroke-width="1.6"/>
<line x1="140" y1="330" x2="280" y2="242.5" stroke="#1f5fa8" stroke-width="2"/>
<line x1="280" y1="242.5" x2="341.4" y2="204.2" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="420" y1="330" x2="280" y2="106" stroke="#b03030" stroke-width="2"/>
<circle cx="341.4" cy="204.2" r="5" fill="#222"/>
<text x="349.4" y="198.2" font-size="14" text-anchor="start" fill="#222" font-weight="normal">u = q<tspan dy="4.5" font-size="10.1">1</tspan><tspan dy="-10.3" font-size="10.1">−1</tspan><tspan dy="5.8">q</tspan><tspan dy="4.5" font-size="10.1">2</tspan><tspan dy="-4.5"> = e</tspan><tspan dy="-5.8" font-size="10.1">nα</tspan></text>
<circle cx="420" cy="330" r="6" fill="#2e7d32"/>
<text x="430" y="350" font-size="13" text-anchor="start" fill="#2e7d32" font-weight="normal">u = +1: self (observer)</text>
<circle cx="140" cy="330" r="5" fill="#222"/>
<text x="130" y="352" font-size="13" text-anchor="end" fill="#222" font-weight="normal">u = −1: antiphase</text>
<circle cx="280" cy="242.5" r="5" fill="#1f5fa8"/>
<text x="270" y="246.5" font-size="14" text-anchor="end" fill="#1f5fa8" font-weight="normal">|k| = tan(α/2)</text>
<circle cx="280" cy="106" r="5" fill="#b03030"/>
<text x="290" y="110" font-size="14" text-anchor="start" fill="#b03030" font-weight="normal">|x| = cot(α/2)</text>
<path d="M310 330A30 30 0 0 0 293.2 303" stroke="#222" fill="none" stroke-width="1.2"/>
<text x="314" y="316" font-size="15" text-anchor="start" fill="#222" font-weight="normal">α</text>
<text x="520" y="110" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">Coupling map (projected from −1)</text>
<text x="520" y="130.3" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">k = (1+u)<tspan dy="-5.8" font-size="10.1">−1</tspan><tspan dy="5.8">(1−u) = −n tan(α/2)</tspan></text>
<text x="520" y="150.6" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">Observer u = +1 is at the origin k = 0</text>
<text x="520" y="170.9" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">Closer in phase → smaller k (weaker)</text>
<text x="520" y="250" font-size="14" text-anchor="start" fill="#b03030" font-weight="normal">Distance map (projected from +1)</text>
<text x="520" y="270.3" font-size="14" text-anchor="start" fill="#b03030" font-weight="normal">x = (1−u)<tspan dy="-5.8" font-size="10.1">−1</tspan><tspan dy="5.8">(1+u) = 1/k</tspan></text>
<text x="520" y="290.6" font-size="14" text-anchor="start" fill="#b03030" font-weight="normal">Observer u = +1 is at infinity (self-distance ∞)</text>
<text x="520" y="310.9" font-size="14" text-anchor="start" fill="#b03030" font-weight="normal">Antiphase u = −1 gives x = 0 (contact)</text>
<text x="520" y="390" font-size="13" text-anchor="start" fill="#222" font-weight="normal">The maps are related by inversion x = 1/k; both conformal</text>
<text x="520" y="408.9" font-size="13" text-anchor="start" fill="#222" font-weight="normal">→ indistinguishable for an observer using visual angles</text>
<text x="520" y="427.7" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Denominators: u by left division by q<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2">; k by q</tspan><tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2">+q</tspan><tspan dy="4.2" font-size="9.4">2</tspan></text>
<text x="520" y="446.6" font-size="13" text-anchor="start" fill="#222" font-weight="normal">(R2, R4. For complex numbers n = i)</text>
</svg>
