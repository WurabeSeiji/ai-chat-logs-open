<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo','Hiragino Sans',sans-serif">
<defs><marker id="a222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="ab03030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b03030"/></marker></defs>
<rect width="920" height="500" fill="#fff"/>
<text x="460" y="28" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">Fig. 9  Spacetime equation = split-octonion null condition = equal-amplitude pair</text>
<line x1="90" y1="450" x2="440" y2="450" stroke="#222" stroke-width="1.5" marker-end="url(#a222)"/>
<line x1="90" y1="450" x2="90" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#a222)"/>
<text x="440" y="474" font-size="13" text-anchor="end" fill="#222" font-weight="normal">|a|  a = (x, y, z, t): spacetime side</text>
<text x="80" y="90" font-size="13" text-anchor="start" fill="#222" font-weight="normal">|b|  b = (R, Q<tspan dy="4.2" font-size="9.4">1</tspan><tspan dy="-4.2">, Q</tspan><tspan dy="4.2" font-size="9.4">2</tspan><tspan dy="-4.2">, Q</tspan><tspan dy="4.2" font-size="9.4">3</tspan><tspan dy="-4.2">): internal side</tspan></text>
<polygon points="90,450 410,450 410,130" stroke="none" fill="#f4f8fc" stroke-width="0"/>
<polygon points="90,450 90,130 410,130" stroke="none" fill="#fcf4f4" stroke-width="0"/>
<line x1="90" y1="450" x2="410" y2="130" stroke="#1f5fa8" stroke-width="3"/>
<text x="418" y="134" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">N = |a|² − |b|² = 0</text>
<text x="320.4" y="370" font-size="14" text-anchor="middle" fill="#888" font-weight="normal">N &gt; 0</text>
<text x="154" y="162" font-size="14" text-anchor="middle" fill="#888" font-weight="normal">N &lt; 0</text>
<circle cx="266" cy="274" r="6" fill="#1f5fa8"/>
<text x="276" y="292" font-size="13" text-anchor="start" fill="#1f5fa8" font-weight="normal">equal amplitude: u = a<tspan dy="-5.4" font-size="9.4">−1</tspan><tspan dy="5.4">b ∈ S³</tspan></text>
<circle cx="266" cy="200.4" r="6" fill="#b03030"/>
<text x="254" y="205.4" font-size="13" text-anchor="end" fill="#b03030" font-weight="normal">|a| ≠ |b|: scalar part in k</text>
<line x1="266" y1="200.4" x2="266" y2="266" stroke="#b03030" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ab03030)"/>
<text x="530" y="110" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Cayley–Dickson: o = (a, b) (a, b quaternions)</text>
<text x="530" y="130.3" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Split-octonion norm N(o) = |a|² − |b|² (signature (4,4))</text>
<text x="530" y="190" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">x²+y²+z²+t² − (R²+Q<tspan dy="4.5" font-size="10.1">1</tspan><tspan dy="-4.5">²+Q</tspan><tspan dy="4.5" font-size="10.1">2</tspan><tspan dy="-4.5">²+Q</tspan><tspan dy="4.5" font-size="10.1">3</tspan><tspan dy="-4.5">²) = 0</tspan></text>
<text x="530" y="210.3" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">  ⇔  |a| = |b|</text>
<text x="530" y="230.6" font-size="14" text-anchor="start" fill="#1f5fa8" font-weight="normal">  ⇔  relative phase u = a<tspan dy="-5.8" font-size="10.1">−1</tspan><tspan dy="5.8">b is a unit quaternion (S³)</tspan></text>
<text x="530" y="305" font-size="13" text-anchor="start" fill="#222" font-weight="normal">→ same as this paper's relational readout of two</text>
<text x="530" y="323.9" font-size="13" text-anchor="start" fill="#222" font-weight="normal">   equal-amplitude quaternions</text>
<text x="530" y="342.7" font-size="13" text-anchor="start" fill="#222" font-weight="normal">→ amplitude mismatch (off the null cone) is a</text>
<text x="530" y="361.6" font-size="13" text-anchor="start" fill="#222" font-weight="normal">   candidate for gravitational distortion</text>
<text x="530" y="395" font-size="12" text-anchor="start" fill="#888" font-weight="normal">Declaration (R2, R3, R4, R7): denominator is the</text>
<text x="530" y="412.4" font-size="12" text-anchor="start" fill="#888" font-weight="normal">spacetime side a (left division); origin of the sums of</text>
<text x="530" y="429.8" font-size="12" text-anchor="start" fill="#888" font-weight="normal">squares is the common origin O of a and b. Reading a<tspan dy="-5" font-size="8.6">−1</tspan><tspan dy="5">b</tspan></text>
<text x="530" y="447.2" font-size="12" text-anchor="start" fill="#888" font-weight="normal">or b a<tspan dy="-5" font-size="8.6">−1</tspan><tspan dy="5"> is a choice brought in from outside</tspan></text>
</svg>
