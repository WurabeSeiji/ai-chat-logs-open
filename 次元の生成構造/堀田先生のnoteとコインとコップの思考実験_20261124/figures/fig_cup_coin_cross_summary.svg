<line x1="30" y1="519" x2="64" y2="519" stroke="#1f77b4" stroke-width="5"/>
<text x="74.0" y="524.0" font-family="'Hiragino Sans','Yu Gothic','Noto Sans CJK JP','Meiryo',sans-serif" font-size="15" fill="#000000" text-anchor="start">C = ∫ c(ψ) dψ、c(ψ) = 2 f(コイン) f(コップ)。点は 15° 刻み (交差項の図 24 枚に対応)</text>
<text x="30.0" y="552.0" font-family="'Hiragino Sans','Yu Gothic','Noto Sans CJK JP','Meiryo',sans-serif" font-size="14" fill="#000000" text-anchor="start">コイン: 倍音 1〜35、フェイエール重み、一本あたりの振幅 R/72、中心 90°</text>
<text x="30.0" y="578.0" font-family="'Hiragino Sans','Yu Gothic','Noto Sans CJK JP','Meiryo',sans-serif" font-size="14" fill="#000000" text-anchor="start">コップ: 倍音 1〜23、フェイエール重み、一本あたりの振幅 R/36</text>
<text x="30.0" y="606.0" font-family="'Hiragino Sans','Yu Gothic','Noto Sans CJK JP','Meiryo',sans-serif" font-size="14" fill="#000000" text-anchor="start">C が帯の外に出るコップの位置: 76.85° 〜 103.15° (コインの中心から ±13.15°)</text>
<text x="30.0" y="634.0" font-family="'Hiragino Sans','Yu Gothic','Noto Sans CJK JP','Meiryo',sans-serif" font-size="14" fill="#666666" text-anchor="start">帯の幅 (仮説): 振幅の分解能 = k × (C の最大) ÷ N = 2 × 0.02142 ÷ 23 = 0.00186 R²。k は重みの係数、N は倍音の数</text>
