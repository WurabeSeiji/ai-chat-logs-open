<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320">
  <defs>
    <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#087f8c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#315c8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#b77812" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dim-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#526475" stroke-width="1.5"/>
    </marker>
    <marker id="dim-end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526475" stroke-width="1.5"/>
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #c8d3dd; stroke-width: 2; }
      .panel-blue { fill: #f7fbfe; stroke: #b9cfdf; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #c8d3dd; stroke-width: 1.7; }
      .box-teal { fill: #f2fbfa; stroke: #8fc8c7; stroke-width: 1.8; }
      .box-gold { fill: #fff9ee; stroke: #d7b26e; stroke-width: 1.8; }
      .ink { fill: #17232e; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Arial, sans-serif; }
      .title { font-size: 45px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #536273; }
      .panel-title { font-size: 29px; font-weight: 700; }
      .body { font-size: 21px; fill: #344454; }
      .small { font-size: 17px; fill: #617080; }
      .math { font-size: 28px; font-weight: 650; }
      .math-small { font-size: 22px; font-weight: 600; }
      .big-math { font-size: 33px; font-weight: 700; }
      .sub { font-size: 65%; baseline-shift: sub; }
      .sup { font-size: 65%; baseline-shift: super; }
      .phase-circle { fill: none; stroke: #93a4b4; stroke-width: 3; }
      .virtual-circle { fill: none; stroke: #b77812; stroke-width: 3.2; stroke-dasharray: 10 9; marker-end: url(#arrow-gold); }
      .guide { fill: none; stroke: #aab6c2; stroke-width: 1.7; stroke-dasharray: 7 7; }
      .radial { fill: none; stroke: #40566b; stroke-width: 4; marker-end: url(#arrow-blue); }
      .tangent { fill: none; stroke: #087f8c; stroke-width: 4.8; marker-end: url(#arrow-teal); }
      .axis { fill: none; stroke: #203040; stroke-width: 2.2; marker-end: url(#arrow-ink); }
      .cell { fill: none; stroke: #087f8c; stroke-width: 5; marker-end: url(#arrow-teal); }
      .flow { fill: none; stroke: #40566b; stroke-width: 2.6; marker-end: url(#arrow-ink); }
      .dimension { fill: none; stroke: #526475; stroke-width: 2; marker-start: url(#dim-start); marker-end: url(#dim-end); }
      .point-p { fill: #087f8c; stroke: #ffffff; stroke-width: 4; }
      .point-c { fill: #c45438; stroke: #ffffff; stroke-width: 4; }
      .point-o { fill: #203040; stroke: #ffffff; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2000" height="1320"/>

  <text class="ink title" x="70" y="70">未来位置中心の回転写像と、調和位相から生じる逆二乗機構</text>
  <text class="ink subtitle" x="72" y="110">AB閉鎖補償の円周方向投影を、関係的な未来位置中心と位相セル閉鎖で定式化する</text>

  <!-- Panel A: geometric map -->
  <rect class="panel" x="60" y="145" width="1130" height="735" rx="12"/>
  <text class="ink panel-title" x="92" y="198">A　円周進行方向に現れる加速度の写像</text>
  <text class="ink body" x="92" y="232">前回の中心方向補償 f<tspan class="sub">AB</tspan> を、未来位置中心を基準とする円周方向読出しへ写す。</text>

  <!-- Original AB phase circle and current point -->
  <circle class="phase-circle" cx="340" cy="610" r="220"/>
  <circle class="point-o" cx="340" cy="610" r="8"/>
  <text class="ink math-small" x="360" y="622">O<tspan class="sub">AB</tspan></text>
  <circle class="point-p" cx="340" cy="390" r="14"/>
  <text class="ink math" x="300" y="365">P</text>
  <text class="ink small" x="220" y="338">現在の位相位置</text>

  <!-- Original radial compensation -->
  <path class="radial" d="M 340 416 L 340 568"/>
  <text class="ink math-small" x="360" y="500" fill="#40566b">f<tspan class="sub">AB</tspan></text>
  <text class="ink small" x="185" y="526">内部では中心方向補償</text>
  <text class="ink small" x="208" y="550">として保持される</text>

  <!-- Tangent readout and future center -->
  <line class="guide" x1="340" y1="390" x2="1080" y2="390"/>
  <text class="ink small" x="830" y="374">円周進行方向　t̂</text>
  <path class="tangent" d="M 365 390 L 668 390"/>
  <text class="ink big-math" x="455" y="438" fill="#087f8c">α = ω<tspan class="sup">2</tspan>R</text>

  <circle class="point-c" cx="690" cy="390" r="15"/>
  <text class="ink math" x="706" y="378">C<tspan class="sub">f</tspan></text>
  <text class="ink small" x="707" y="408">関係的な未来位置中心</text>

  <!-- R dimension -->
  <line class="guide" x1="340" y1="350" x2="340" y2="382"/>
  <line class="guide" x1="690" y1="350" x2="690" y2="382"/>
  <line class="dimension" x1="346" y1="350" x2="684" y2="350"/>
  <text class="ink math-small" x="505" y="337">R</text>

  <!-- Virtual rotation about future center -->
  <path class="virtual-circle" d="M 340 390 A 350 350 0 0 0 690 740 A 350 350 0 0 0 1040 390"/>
  <text class="ink math" x="855" y="710" fill="#a8680c">ω</text>
  <text class="ink small" x="820" y="742">C<tspan class="sub">f</tspan> を中心とする仮想回転</text>

  <!-- Mapping equations -->
  <rect class="box-teal" x="690" y="500" width="455" height="275" rx="10"/>
  <text class="ink body" x="720" y="542">未来位置中心の定義</text>
  <text class="ink math" x="720" y="588">C<tspan class="sub">f</tspan> = P + R t̂</text>
  <text class="ink body" x="720" y="634">仮想回転の中心向き加速度</text>
  <text class="ink math" x="720" y="680">α⃗(P) = ω<tspan class="sup">2</tspan>(C<tspan class="sub">f</tspan> − P)</text>
  <text class="ink big-math" x="720" y="732">|α⃗| = ω<tspan class="sup">2</tspan>R</text>
  <text class="ink small" x="720" y="760">C<tspan class="sub">f</tspan> は外部空間の固定中心ではなく、位相関係から定義する。</text>

  <rect class="box-gold" x="92" y="780" width="520" height="70" rx="8"/>
  <text class="ink small" x="116" y="812">同じ f<tspan class="sub">AB</tspan> を新しい力として追加しない。</text>
  <text class="ink small" x="116" y="838">中心方向の閉鎖補償を、未来位置方向へ射影して読む。</text>

  <!-- Panel B: harmonic closure -->
  <rect class="panel-blue" x="1220" y="145" width="720" height="735" rx="12"/>
  <text class="ink panel-title" x="1252" y="198">B　調和閉鎖が ω と Δθ を結ぶ</text>
  <text class="ink body" x="1252" y="232">閉じた位相円では、整数巻数が位相セル幅を固定する。</text>

  <!-- Example phase circle n=8 -->
  <circle class="phase-circle" cx="1580" cy="430" r="170"/>
  <circle class="point-o" cx="1580" cy="430" r="7"/>
  <line class="guide" x1="1580" y1="430" x2="1750" y2="430"/>
  <line class="guide" x1="1580" y1="430" x2="1700.2" y2="309.8"/>
  <line class="guide" x1="1580" y1="430" x2="1580" y2="260"/>
  <line class="guide" x1="1580" y1="430" x2="1459.8" y2="309.8"/>
  <line class="guide" x1="1580" y1="430" x2="1410" y2="430"/>
  <line class="guide" x1="1580" y1="430" x2="1459.8" y2="550.2"/>
  <line class="guide" x1="1580" y1="430" x2="1580" y2="600"/>
  <line class="guide" x1="1580" y1="430" x2="1700.2" y2="550.2"/>
  <path class="cell" d="M 1750 430 A 170 170 0 0 0 1700.2 309.8"/>
  <text class="ink math-small" x="1725" y="335" fill="#087f8c">Δθ<tspan class="sub">n</tspan></text>
  <path class="axis" d="M 1430 510 A 170 170 0 0 0 1420 380"/>
  <text class="ink math" x="1378" y="585">ω<tspan class="sub">n</tspan></text>
  <text class="ink small" x="1630" y="612">図示例: |n| = 8</text>

  <!-- Harmonic equations -->
  <rect class="box" x="1260" y="635" width="640" height="210" rx="10"/>
  <text class="ink math-small" x="1290" y="675">n ∈ ℤ \ {0}</text>
  <text class="ink math" x="1290" y="720">Δθ<tspan class="sub">n</tspan> = 2π / |n|</text>
  <text class="ink math" x="1290" y="766">ω<tspan class="sub">n</tspan> = nω<tspan class="sub">1</tspan></text>
  <text class="ink big-math" x="1290" y="816">|ω<tspan class="sub">n</tspan>| Δθ<tspan class="sub">n</tspan> = 2πω<tspan class="sub">1</tspan> ≡ Ω</text>
  <text class="ink small" x="1595" y="676">符号は回転方向だけを反転する。</text>

  <!-- Bottom derivation -->
  <rect class="panel" x="60" y="910" width="1880" height="350" rx="12"/>
  <text class="ink panel-title" x="92" y="958">C　条件を接続すると、位相セル幅に対する逆二乗が代数的に確定する</text>

  <rect class="box" x="90" y="995" width="390" height="105" rx="9"/>
  <text class="ink small" x="115" y="1028">位相円の閉鎖</text>
  <text class="ink math" x="115" y="1072">|n| Δθ<tspan class="sub">n</tspan> = 2π</text>

  <path class="flow" d="M 488 1048 L 535 1048"/>

  <rect class="box" x="545" y="995" width="390" height="105" rx="9"/>
  <text class="ink small" x="570" y="1028">角速度–位相セル双対</text>
  <text class="ink math" x="570" y="1072">|ω<tspan class="sub">n</tspan>| = Ω / Δθ<tspan class="sub">n</tspan></text>

  <path class="flow" d="M 943 1048 L 990 1048"/>

  <rect class="box" x="1000" y="995" width="390" height="105" rx="9"/>
  <text class="ink small" x="1025" y="1028">未来位置中心の回転写像</text>
  <text class="ink math" x="1025" y="1072">α<tspan class="sub">n</tspan> = R |ω<tspan class="sub">n</tspan>|<tspan class="sup">2</tspan></text>

  <path class="flow" d="M 1398 1048 L 1445 1048"/>

  <rect class="box-teal" x="1455" y="985" width="445" height="125" rx="9"/>
  <text class="ink small" x="1480" y="1020">導出結果</text>
  <text class="ink big-math" x="1480" y="1070">α<tspan class="sub">n</tspan> = R Ω<tspan class="sup">2</tspan> / Δθ<tspan class="sub">n</tspan><tspan class="sup">2</tspan></text>
  <text class="ink small" x="1480" y="1098">逆二乗項を別に入力しない。</text>

  <rect class="box-gold" x="90" y="1140" width="1810" height="88" rx="9"/>
  <text class="ink body" x="118" y="1175">成立条件:</text>
  <text class="ink small" x="225" y="1175">R を同じ閉鎖写像の曲率半径として保ち、Δθ<tspan class="sub">n</tspan> と ω<tspan class="sub">n</tspan> を独立に選ばず、|ω<tspan class="sub">n</tspan>|Δθ<tspan class="sub">n</tspan> = Ω を満たす。</text>
  <text class="ink small" x="118" y="1208">距離読出し L<tspan class="sub">read</tspan> = κΔθ<tspan class="sub">n</tspan> を採用する場合:　α<tspan class="sub">n</tspan> = RΩ<tspan class="sup">2</tspan>κ<tspan class="sup">2</tspan> / L<tspan class="sub">read</tspan><tspan class="sup">2</tspan></text>

  <text class="ink small" x="70" y="1292">図の分類: 未来位置中心による加速度方向は物理的解釈、調和閉鎖から逆二乗式までの変形は条件付き導出。</text>
</svg>
