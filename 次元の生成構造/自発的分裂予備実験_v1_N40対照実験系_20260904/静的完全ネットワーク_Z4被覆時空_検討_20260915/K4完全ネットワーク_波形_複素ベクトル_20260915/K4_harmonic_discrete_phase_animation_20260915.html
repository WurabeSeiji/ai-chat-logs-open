<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K4 Harmonic Discrete Phase Animation</title>
<style>
:root{
  --bg:#ffffff; --panel:#f8fafc; --text:#111827; --muted:#64748b; --border:#cbd5e1;
  --red:#dc2626; --blue:#2563eb; --green:#059669; --dark:#111827; --gray:#64748b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 6px}
.sub{font-size:14px;color:var(--muted);margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
button,select{font:inherit;min-height:42px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:9px 14px}
button{cursor:pointer}
button:hover{background:#f1f5f9}
.badge{border:1px solid var(--border);border-radius:999px;background:#fff;padding:7px 10px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;min-width:0}
.panel h2{font-size:16px;margin:0 0 8px}
.wave-panel{grid-column:1/-1}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
.info{font-size:14px;line-height:1.5;margin-top:8px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.wave-panel{grid-column:auto}}
</style>
</head>
<body>
<main id="app">
  <h1>U⁴ = I：基底波＋倍音1本の離散位相アニメーション</h1>
  <div class="sub">背景は固定し、状態 k=0,1,2,3 に応じて赤いマーカーだけが離散的に移動します。</div>

  <div class="controls">
    <label>倍音
      <select id="harmonic">
        <option value="2">m = 2（偶数倍音）</option>
        <option value="3" selected>m = 3（奇数倍音）</option>
      </select>
    </label>
    <button id="play" type="button">▶ Play</button>
    <button id="pause" type="button">⏸ Pause</button>
    <button id="prev" type="button">← 戻る</button>
    <button id="next" type="button">次へ →</button>
    <span class="badge" id="stateBadge">k = 0</span>
    <span class="badge" id="formulaBadge">S₀ = (1, 1)</span>
  </div>

  <div class="grid">
    <section class="panel">
      <h2>完全ネットワーク K₄（4頂点・6辺）</h2>
      <svg id="network" viewBox="0 0 640 430" aria-label="完全ネットワーク K4">
        <g id="networkEdges"></g>
        <g id="networkNodes"></g>
        <circle id="networkMarker" r="19" fill="none" stroke="#dc2626" stroke-width="6"></circle>
      </svg>
      <div class="legend">
        <span><i class="dot" style="background:#2563eb"></i>時間隣接関係</span>
        <span><i class="dot" style="background:#64748b"></i>その他の完全グラフ関係</span>
        <span><i class="dot" style="background:#dc2626"></i>現在状態</span>
      </div>
    </section>

    <section class="panel">
      <h2>複素平面：2本の位相ベクトル</h2>
      <svg id="complex" viewBox="0 0 420 420" aria-label="複素平面">
        <line x1="40" y1="210" x2="380" y2="210" stroke="#94a3b8"/>
        <line x1="210" y1="40" x2="210" y2="380" stroke="#94a3b8"/>
        <circle cx="210" cy="210" r="140" fill="none" stroke="#cbd5e1" stroke-dasharray="5 5"/>
        <text x="374" y="198" font-size="14">Re</text>
        <text x="218" y="50" font-size="14">Im</text>

        <line id="baseVec" x1="210" y1="210" x2="350" y2="210" stroke="#2563eb" stroke-width="5"/>
        <line id="harmVec" x1="210" y1="210" x2="350" y2="210" stroke="#059669" stroke-width="5"/>
        <circle id="baseDot" cx="350" cy="210" r="8" fill="#dc2626"/>
        <circle id="harmDot" cx="350" cy="210" r="8" fill="#dc2626"/>
        <text id="baseLabel" x="290" y="185" font-size="14" fill="#2563eb">base</text>
        <text id="harmLabel" x="290" y="235" font-size="14" fill="#059669">harmonic</text>
      </svg>
      <div class="info" id="complexInfo"></div>
    </section>

    <section class="panel wave-panel">
      <h2>基底波・倍音・合成波形</h2>
      <svg id="wave" viewBox="0 0 1050 420" aria-label="波形">
        <g id="waveGrid"></g>
        <g id="waveCurves"></g>
        <line id="phaseLine" x1="70" y1="40" x2="70" y2="370" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 7"/>
        <circle id="baseWaveDot" r="7" fill="#dc2626"></circle>
        <circle id="harmWaveDot" r="7" fill="#dc2626"></circle>
        <circle id="sumWaveDot" r="7" fill="#dc2626"></circle>
      </svg>
      <div class="legend">
        <span><i class="dot" style="background:#2563eb"></i>cos θ</span>
        <span><i class="dot" style="background:#059669"></i>cos(mθ)</span>
        <span><i class="dot" style="background:#111827"></i>合成</span>
        <span><i class="dot" style="background:#dc2626"></i>現在位相</span>
      </div>
    </section>
  </div>
</main>

<script>
(() => {
  const root = document.getElementById('app');
  if (root.dataset.init === '1') return;
  root.dataset.init = '1';

  const nodePos = [
    {x:320,y:70}, {x:540,y:220}, {x:320,y:365}, {x:100,y:220}
  ];
  const labels = ['S₀','S₁','S₂','S₃'];
  const edges = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];

  const netEdges = document.getElementById('networkEdges');
  const netNodes = document.getElementById('networkNodes');

  edges.forEach(([a,b]) => {
    const temporal = ((b-a+4)%4===1)||((a-b+4)%4===1);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',nodePos[a].x); line.setAttribute('y1',nodePos[a].y);
    line.setAttribute('x2',nodePos[b].x); line.setAttribute('y2',nodePos[b].y);
    line.setAttribute('stroke', temporal ? '#2563eb' : '#64748b');
    line.setAttribute('stroke-width', temporal ? '4' : '2.5');
    if(!temporal) line.setAttribute('stroke-dasharray','8 7');
    netEdges.appendChild(line);
  });

  nodePos.forEach((p,k) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r','13');
    c.setAttribute('fill','#fff'); c.setAttribute('stroke','#111827'); c.setAttribute('stroke-width','2');
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',p.x+18); t.setAttribute('y',p.y+5); t.setAttribute('font-size','16');
    t.textContent = labels[k];
    g.appendChild(c); g.appendChild(t); netNodes.appendChild(g);
  });

  const waveGrid = document.getElementById('waveGrid');
  const waveCurves = document.getElementById('waveCurves');
  const W={x0:70,x1:1010,yBase:100,yHarm:215,ySum:335,amp:48};

  function addLine(x1,y1,x2,y2,stroke,width=1,dash=''){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',stroke);l.setAttribute('stroke-width',width);
    if(dash) l.setAttribute('stroke-dasharray',dash);
    return l;
  }

  [W.yBase,W.yHarm,W.ySum].forEach(y=>waveGrid.appendChild(addLine(W.x0,y,W.x1,y,'#cbd5e1',1)));

  [0,1,2,3,4].forEach(q=>{
    const x=W.x0+(W.x1-W.x0)*q/4;
    waveGrid.appendChild(addLine(x,45,x,375,'#e2e8f0',1,'4 5'));
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x-12); t.setAttribute('y','400'); t.setAttribute('font-size','13');
    t.textContent = q===4 ? '2π' : (q===0?'0':`${q}π/2`);
    waveGrid.appendChild(t);
  });

  const waveLabels = [
    ['base: cos θ',W.yBase-62,'#2563eb'],
    ['harmonic: cos(mθ)',W.yHarm-62,'#059669'],
    ['sum',W.ySum-78,'#111827']
  ];
  waveLabels.forEach(([txt,y,col])=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x','75'); t.setAttribute('y',y); t.setAttribute('font-size','15'); t.setAttribute('fill',col);
    t.textContent=txt; waveGrid.appendChild(t);
  });

  function pathFor(fn, center, amp){
    const n=800, pts=[];
    for(let i=0;i<n;i++){
      const theta=2*Math.PI*i/(n-1);
      const x=W.x0+(W.x1-W.x0)*i/(n-1);
      const y=center-amp*fn(theta);
      pts.push(`${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`);
    }
    return pts.join(' ');
  }

  const basePath=document.createElementNS('http://www.w3.org/2000/svg','path');
  const harmPath=document.createElementNS('http://www.w3.org/2000/svg','path');
  const sumPath=document.createElementNS('http://www.w3.org/2000/svg','path');

  [[basePath,'#2563eb'],[harmPath,'#059669'],[sumPath,'#111827']].forEach(([p,c])=>{
    p.setAttribute('fill','none'); p.setAttribute('stroke',c); p.setAttribute('stroke-width','3');
    waveCurves.appendChild(p);
  });

  let k=0, m=3, timer=null, playing=false;
  const interval=900;

  function cexp(q){
    const a=Math.PI/2*q;
    return {re:Math.round(Math.cos(a)),im:Math.round(Math.sin(a))};
  }
  function fmt(z){
    if(z.re===1&&z.im===0)return '1';
    if(z.re===-1&&z.im===0)return '-1';
    if(z.re===0&&z.im===1)return 'i';
    if(z.re===0&&z.im===-1)return '-i';
    return `${z.re}${z.im>=0?'+':''}${z.im}i`;
  }

  function renderStaticForM(){
    basePath.setAttribute('d',pathFor(th=>Math.cos(th),W.yBase,W.amp));
    harmPath.setAttribute('d',pathFor(th=>Math.cos(m*th),W.yHarm,W.amp));
    sumPath.setAttribute('d',pathFor(th=>Math.cos(th)+Math.cos(m*th),W.ySum,W.amp*0.72));
  }

  function render(){
    const theta=k*Math.PI/2;
    const z1=cexp(k);
    const zm=cexp((m*k)%4);

    document.getElementById('stateBadge').textContent=`k = ${k}`;
    document.getElementById('formulaBadge').textContent=`S${k} = (${fmt(z1)}, ${fmt(zm)})`;

    const marker=document.getElementById('networkMarker');
    marker.setAttribute('cx',nodePos[k].x); marker.setAttribute('cy',nodePos[k].y);

    const cx=210, cy=210, r=140;
    const bx=cx+r*z1.re, by=cy-r*z1.im;
    const hx=cx+r*zm.re, hy=cy-r*zm.im;

    const bv=document.getElementById('baseVec'), hv=document.getElementById('harmVec');
    bv.setAttribute('x2',bx); bv.setAttribute('y2',by);
    hv.setAttribute('x2',hx); hv.setAttribute('y2',hy);

    document.getElementById('baseDot').setAttribute('cx',bx);
    document.getElementById('baseDot').setAttribute('cy',by);
    document.getElementById('harmDot').setAttribute('cx',hx);
    document.getElementById('harmDot').setAttribute('cy',hy);

    document.getElementById('baseLabel').setAttribute('x',cx+0.62*r*z1.re);
    document.getElementById('baseLabel').setAttribute('y',cy-0.62*r*z1.im-10);
    document.getElementById('harmLabel').setAttribute('x',cx+0.62*r*zm.re);
    document.getElementById('harmLabel').setAttribute('y',cy-0.62*r*zm.im+18);

    document.getElementById('complexInfo').textContent=
      `θ = ${k}π/2 / base = ${fmt(z1)} / harmonic = ${fmt(zm)}`;

    const x=W.x0+(W.x1-W.x0)*(k/4);
    const y1=W.yBase-W.amp*Math.cos(theta);
    const ym=W.yHarm-W.amp*Math.cos(m*theta);
    const ys=W.ySum-W.amp*0.72*(Math.cos(theta)+Math.cos(m*theta));

    const phaseLine=document.getElementById('phaseLine');
    phaseLine.setAttribute('x1',x); phaseLine.setAttribute('x2',x);

    [['baseWaveDot',y1],['harmWaveDot',ym],['sumWaveDot',ys]].forEach(([id,y])=>{
      const c=document.getElementById(id);
      c.setAttribute('cx',x); c.setAttribute('cy',y);
    });
  }

  function step(delta){
    k=(k+delta+4)%4;
    render();
  }
  function play(){
    if(playing) return;
    playing=true;
    timer=setInterval(()=>step(1),interval);
  }
  function pause(){
    playing=false;
    if(timer){clearInterval(timer); timer=null;}
  }

  document.getElementById('harmonic').addEventListener('change',e=>{
    m=Number(e.target.value);
    k=0;
    renderStaticForM();
    render();
  });
  document.getElementById('play').addEventListener('click',play);
  document.getElementById('pause').addEventListener('click',pause);
  document.getElementById('prev').addEventListener('click',()=>{pause();step(-1);});
  document.getElementById('next').addEventListener('click',()=>{pause();step(1);});

  renderStaticForM();
  render();
  play();
})();
</script>
</body>
</html>
