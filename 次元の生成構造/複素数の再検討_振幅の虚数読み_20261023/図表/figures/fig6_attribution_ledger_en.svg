   <g id="text_1">
    <text style="fill: #2a56c6; font: 700 13px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="130.518" y="93.682737" transform="rotate(-0 130.518 93.682737)">Already in ℂ</text>
   </g>
   <g id="text_2">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 127.450894)">• amplitude–phase duality (90° rotation</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 138.637628)">  of the exponent plane)</text>
   </g>
   <g id="text_3">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 176.779564)">• imaginary amplitude → indefinite norm,</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 187.81208)">  light cone</text>
   </g>
   <g id="text_4">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 226.165516)">• two sections of the complex angle:</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 237.170126)">  cos² (Born) and cosh φ = γ</text>
   </g>
   <g id="text_5">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="25.335" y="275.598468" transform="rotate(-0 25.335 275.598468)">• self-dual point |k| = 1 (α = π/2)</text>
   </g>
   <g id="text_6">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 306.879992)">• Σz = 0 and Σz² = 0, U^n = I, counting</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 317.884601)">  m/n</text>
   </g>
   <g id="text_7">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 356.133756)">• the division trap, linearity in the</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 367.166272)">  exponent</text>
   </g>
   <g id="text_8">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 405.643083)">• amplitude ≠ curvature radius (visible</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 416.628599)">  on S¹ × ℝ)</text>
   </g>
   <g id="text_9">
    <text style="fill: #0e7a6e; font: 700 13px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="369.9" y="93.682737" transform="rotate(-0 369.9 93.682737)">Added by ℍ</text>
   </g>
   <g id="text_10">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 127.299612)">• amplitude and phase become</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 138.439347)">  distinguishable (m ⊥ n)</text>
   </g>
   <g id="text_11">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 176.826564)">• non-commutativity [m, n] = 2m × n →</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 187.85908)">  third direction = space</text>
   </g>
   <g id="text_12">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 226.23161)">• signature (1, 3) of the true square;</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 237.23622)">  light cone with direction</text>
   </g>
   <g id="text_13">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="275.457468" transform="rotate(-0 264.717 275.457468)">• two standing waves remember a position</text>
   </g>
   <g id="text_14">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 306.871179)">• condensates become possible (ℂ has no</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 317.856695)">  direction)</text>
   </g>
   <g id="text_15">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="356.321756" transform="rotate(-0 264.717 356.321756)">• 3-body discriminant Δ₃ = ¼|uv − vu|²</text>
   </g>
   <g id="text_16">
    <text style="fill: #c4470f; font: 700 13px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="609.282" y="93.682737" transform="rotate(-0 609.282 93.682737)">Added by 𝕆</text>
   </g>
   <g id="text_17">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 127.459706)">• non-associativity: associator needs 3;</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 138.492222)">  with closure, 4</text>
   </g>
   <g id="text_18">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 176.826564)">• R-type and Q-type amplitudes become</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 187.85908)">  distinct → mass vs charge</text>
   </g>
   <g id="text_19">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 226.194891)">• split form (4, 4) and |a| = |b|: the</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 237.180407)">  spacetime equation</text>
   </g>
   <g id="text_20">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 275.551468)">• order of sequential bonding matters</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 286.710297)">  (history)</text>
   </g>
   <g id="text_21">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="504.099" y="324.966795" transform="rotate(-0 504.099 324.966795)">• no Dyson ensemble (no precedent)</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font: 11.5px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="358.2" y="16.180781" transform="rotate(-0 358.2 16.180781)">Attribution ledger: a property belongs to level L only if it cannot be stated with the algebra of level L − 1</text>
  </g>
 </g>
