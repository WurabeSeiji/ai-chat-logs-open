   <g id="text_1">
    <text style="fill: #2a56c6; font: 700 13px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="130.518" y="93.682737" transform="rotate(-0 130.518 93.682737)">ℂ にすでにあるもの</text>
   </g>
   <g id="text_2">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="25.335" y="127.299612" transform="rotate(-0 25.335 127.299612)">• 振幅と位相の双対（指数平面の 90° 回転）</text>
   </g>
   <g id="text_3">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="25.335" y="158.589948" transform="rotate(-0 25.335 158.589948)">• 虚数振幅 → 不定計量・光円錐</text>
   </g>
   <g id="text_4">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 189.880284)">• 複素角の二断面：cos²（ボルン則）と cosh</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 200.8658)">  φ ＝ γ</text>
   </g>
   <g id="text_5">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="25.335" y="239.962424" transform="rotate(-0 25.335 239.962424)">• 自己双対点 |k| ＝ 1（α ＝ π/2）</text>
   </g>
   <g id="text_6">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 270.556572)">• Σz ＝ 0 と Σz² ＝ 0、U^n ＝</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 282.094705)">  I、m/n の数え上げ</text>
   </g>
   <g id="text_7">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="25.335" y="319.942524" transform="rotate(-0 25.335 319.942524)">• 割り算の罠、指数部での線形性</text>
   </g>
   <g id="text_8">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 351.23286)">• 振幅 ≠ 曲率半径（円柱 S¹ × ℝ</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(25.335 362.218376)">  で見える）</text>
   </g>
   <g id="text_9">
    <text style="fill: #0e7a6e; font: 700 13px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="369.9" y="93.682737" transform="rotate(-0 369.9 93.682737)">ℍ が足すもの</text>
   </g>
   <g id="text_10">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="127.299612" transform="rotate(-0 264.717 127.299612)">• 振幅と位相が区別できる（m ⊥ n）</text>
   </g>
   <g id="text_11">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 158.758855)">• 非可換性 [m, n] ＝ 2m × n →</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(264.717 169.74437)">  第三の方向＝空間</text>
   </g>
   <g id="text_12">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="208.3049" transform="rotate(-0 264.717 208.3049)">• 本当の二乗の符号 (1, 3)、向きを持つ光円錐</text>
   </g>
   <g id="text_13">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="239.266236" transform="rotate(-0 264.717 239.266236)">• 二つの定常波が位置を記憶する</text>
   </g>
   <g id="text_14">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="270.556572" transform="rotate(-0 264.717 270.556572)">• 凝縮体が作れる（複素数では方向がない）</text>
   </g>
   <g id="text_15">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="264.717" y="302.487283" transform="rotate(-0 264.717 302.487283)">• 3 体の判別式 Δ₃ ＝ ¼|uv − vu|²</text>
   </g>
   <g id="text_16">
    <text style="fill: #c4470f; font: 700 13px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="609.282" y="93.682737" transform="rotate(-0 609.282 93.682737)">𝕆 が足すもの</text>
   </g>
   <g id="text_17">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 127.299612)">• 非結合性：結合子は 3 個で立つ、閉塞まで課すと</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 138.285128)">  4 個</text>
   </g>
   <g id="text_18">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 176.685564)">• R 型と Q 型の振幅が代数的に別物 →</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 187.67108)">  質量と電荷の区別</text>
   </g>
   <g id="text_19">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 226.786798)">• 分解型 (4, 4) と |a| ＝</text>
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(504.099 238.594813)">  |b|：時空方程式</text>
   </g>
   <g id="text_20">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="504.099" y="275.457468" transform="rotate(-0 504.099 275.457468)">• 逐次の結合の順序が結果を変える（履歴）</text>
   </g>
   <g id="text_21">
    <text style="fill: #18212c; font: 9.4px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="504.099" y="307.651086" transform="rotate(-0 504.099 307.651086)">• Dyson の集団が存在しない（前例なし）</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font: 11.5px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: middle" x="358.2" y="16.065781" transform="rotate(-0 358.2 16.065781)">帰属の台帳：段 L の性質と言えるのは、段 L − 1 の代数では述べられないことを示したときだけ</text>
  </g>
 </g>
