    <text style="fill: #596577; font: 9px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(232.32885 248.931363)">The same rotation appears as:</text>
    <text style="fill: #596577; font: 9px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(175.896038 259.210488)">number–phase conjugacy, time–frequency,</text>
    <text style="fill: #596577; font: 9px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(211.429163 269.568363)">Wick rotation (decay ↔ oscillation),</text>
    <text style="fill: #596577; font: 9px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(284.144944 279.784488)">Laplace s = σ + iω</text>
