   <g id="text_6">
    <text style="fill: #596577; font: 8.5px 'Hiragino Sans', 'DejaVu Sans'; text-anchor: start" x="100.035925" y="358.527825" transform="rotate(-0 100.035925 358.527825)">a = π/5, θ = π/3   commutator = 1.0181 (m×n)   predicted 2 sin a sin θ = 1.0181</text>
   </g>
   <g id="text_7">
    <text style="font: 10px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(33.13125 15.059375)">Quaternions: rotations about the amplitude axis m and the phase axis n do not commute;</text>
    <text style="font: 10px 'Hiragino Sans', 'DejaVu Sans'" transform="translate(7.2 26.540625)">the commutator e^{ma}e^{nθ} − e^{nθ}e^{ma} = 2 sin a sin θ (m × n) generates the third direction</text>
   </g>
