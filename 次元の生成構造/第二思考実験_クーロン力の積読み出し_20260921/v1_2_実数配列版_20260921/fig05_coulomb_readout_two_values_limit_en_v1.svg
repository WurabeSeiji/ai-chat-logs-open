<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif">
<rect width="920" height="420" fill="#fff"/>
<text x="460" y="28" font-size="14" text-anchor="middle">What two values can read, and what first becomes readable with three bodies</text>
<text x="210" y="70" font-size="13" text-anchor="middle">two bodies: one relation</text>
<polyline points="110,150 310,150" fill="none" stroke="#000" stroke-width="2"/>
<path d="M110 150h0M310 150h0" stroke="#1f77b4" stroke-width="18" stroke-linecap="round" fill="none"/>
<text x="210" y="138" font-size="13" text-anchor="middle">μ12 : + / 0 / −</text>
<text x="40" y="232" font-size="12" text-anchor="start">readable: the law's number τ, eccentricity e,</text>
<text x="40" y="256" font-size="12" text-anchor="start">sign of the coupling μ, angle steps and distance ratios</text>
<text x="40" y="294" font-size="12" text-anchor="start" fill="#d62728">not readable: mass ratio, charge ratio, a map</text>
<polyline points="440,50 440,390" fill="none" stroke="#ccc" stroke-width="1"/>
<text x="690" y="70" font-size="13" text-anchor="middle">three bodies: a triangle</text>
<polyline points="580,250 800,250 690,100 580,250" fill="none" stroke="#000" stroke-width="2"/>
<path d="M580 250h0M800 250h0M690 100h0" stroke="#1f77b4" stroke-width="18" stroke-linecap="round" fill="none"/>
<g font-size="13" text-anchor="start"><text x="554" y="256">σ1</text><text x="814" y="256">σ2</text><text x="704" y="106">σ3</text></g>
<text x="690" y="272" font-size="13" text-anchor="middle">s12</text>
<text x="762" y="172" font-size="13" text-anchor="start">s23</text>
<text x="618" y="172" font-size="13" text-anchor="end">s31</text>
<g font-size="12" text-anchor="middle"><text x="690" y="318">shape degrees of freedom 2N−4: 0 for N=2, 2 for N=3</text><text x="690" y="342">s12·s23·s31 = +1 ⇔ sij = σi·σj</text><text x="690" y="366">(intrinsic charge arises as consistency of relations)</text></g>
</svg>
