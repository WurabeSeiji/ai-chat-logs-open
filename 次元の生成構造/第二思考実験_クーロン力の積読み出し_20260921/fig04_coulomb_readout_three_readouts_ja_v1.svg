<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif">
<rect width="920" height="480" fill="#fff"/>
<text x="460" y="28" font-size="14" text-anchor="middle">三つの面積読み出しと、モデルの流れ</text>
<rect x="40" y="60" width="380" height="380" fill="none" fill-opacity="1.0" stroke="#000"/>
<text x="230" y="458" font-size="12" text-anchor="middle">二つの値の平面</text>
<polyline points="40,250 420,250" fill="none" stroke="#999" stroke-width="1"/>
<polyline points="230,440 230,60" fill="none" stroke="#999" stroke-width="1"/>
<polyline points="52.7,427.3 407.3,72.7" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
<text x="409.9" y="244" font-size="12" text-anchor="end">a</text>
<text x="236" y="72.7" font-size="12" text-anchor="start">b</text>
<text x="388.3" y="85.3" font-size="11" text-anchor="end" fill="#777">a=b</text>
<polygon points="230,250 356.7,199.3 306,72.7 179.3,123.3" fill="#2ca02c" fill-opacity="0.15"/>
<polyline points="230,250 356.7,199.3" fill="none" stroke="#000" stroke-width="2"/>
<polygon points="356.7,199.3 351,205 348.7,199.2" fill="#000" fill-opacity="1.0"/>
<text x="364.7" y="203.3" font-size="12" text-anchor="start">X</text>
<polyline points="230,250 280.7,123.3" fill="none" stroke="#1f77b4" stroke-width="2"/>
<polygon points="280.7,123.3 280.8,131.3 275,129" fill="#1f77b4" fill-opacity="1.0"/>
<text x="288.7" y="117.3" font-size="12" text-anchor="start" fill="#1f77b4">PX（入れ替え）</text>
<polyline points="230,250 103.3,199.3" fill="none" stroke="#ff7f0e" stroke-width="2"/>
<polygon points="103.3,199.3 111.3,199.2 109,205" fill="#ff7f0e" fill-opacity="1.0"/>
<text x="99.3" y="219.3" font-size="12" text-anchor="start" fill="#ff7f0e">DX（符号反転）</text>
<polyline points="230,250 179.3,123.3" fill="none" stroke="#2ca02c" stroke-width="2"/>
<polygon points="179.3,123.3 185,129 179.2,131.3" fill="#2ca02c" fill-opacity="1.0"/>
<text x="169.3" y="113.3" font-size="12" text-anchor="end" fill="#2ca02c">J0X（四分の一回転）</text>
<text x="328.8" y="100.5" font-size="12" text-anchor="start" fill="#2ca02c">面積 = r</text>
<text x="470" y="92" font-size="13" text-anchor="start" fill="#1f77b4">x = ω(X, PX) = a²−b²</text>
<text x="470" y="116" font-size="13" text-anchor="start" fill="#ff7f0e">y = ω(X, DX) = 2ab</text>
<text x="470" y="140" font-size="13" text-anchor="start" fill="#2ca02c">r = ω(X, J0X) = a²+b²</text>
<text x="470" y="168" font-size="13" text-anchor="start">x² + y² − r² = 0（ゼロ閉塞）</text>
<rect x="470" y="196" width="420" height="34" fill="#f4f4f4" fill-opacity="1.0" stroke="#888"/>
<text x="680" y="218" font-size="12" text-anchor="middle">二つの値 X=(a,b)</text>
<polyline points="680,230 680,247" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="680,247 677.3,240.6 682.7,240.6" fill="#555" fill-opacity="1.0"/>
<rect x="470" y="248" width="420" height="34" fill="#f4f4f4" fill-opacity="1.0" stroke="#888"/>
<text x="680" y="270" font-size="12" text-anchor="middle">線形の法則  X_{k+1}+X_{k−1}=τX_k</text>
<polyline points="680,282 680,299" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="680,299 677.3,292.6 682.7,292.6" fill="#555" fill-opacity="1.0"/>
<rect x="470" y="300" width="420" height="34" fill="#f4f4f4" fill-opacity="1.0" stroke="#888"/>
<text x="680" y="322" font-size="12" text-anchor="middle">位置＝三つの面積読み出し (x, y, r)</text>
<polyline points="680,334 680,351" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="680,351 677.3,344.6 682.7,344.6" fill="#555" fill-opacity="1.0"/>
<rect x="470" y="352" width="420" height="34" fill="#f4f4f4" fill-opacity="1.0" stroke="#888"/>
<text x="680" y="374" font-size="12" text-anchor="middle">時計  Δt_k ∝ X_k·X_{k+1}（面積の保存から）</text>
<polyline points="680,386 680,403" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="680,403 677.3,396.6 682.7,396.6" fill="#555" fill-opacity="1.0"/>
<rect x="470" y="404" width="420" height="34" fill="#f4f4f4" fill-opacity="1.0" stroke="#888"/>
<text x="680" y="426" font-size="12" text-anchor="middle">逆二乗の力・焦点が原点の円錐曲線</text>
</svg>
