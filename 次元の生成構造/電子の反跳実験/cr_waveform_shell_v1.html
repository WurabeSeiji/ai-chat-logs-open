<title>__TITLE__</title>
<style>
:root{
  --ground:#eaeef0; --panel:#f7f9fa; --edge:#c8d2d8; --grid:#dbe3e8;
  --ink:#16222b; --dim:#5d7280; --faint:#93a6b1;
  --a:#0f9c92; --b:#c9791a; --res:#b8306f; --om:#5b6fa8;
  --shadow:0 1px 2px rgba(20,34,44,.08),0 8px 24px rgba(20,34,44,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0a0f14; --panel:#121a21; --edge:#26343f; --grid:#1b2731;
    --ink:#dbe6ec; --dim:#8fa0ab; --faint:#5a6d79;
    --a:#34d1c4; --b:#f0a13a; --res:#d8508f; --om:#8ea3d8;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0a0f14; --panel:#121a21; --edge:#26343f; --grid:#1b2731;
  --ink:#dbe6ec; --dim:#8fa0ab; --faint:#5a6d79;
  --a:#34d1c4; --b:#f0a13a; --res:#d8508f; --om:#8ea3d8;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;margin-bottom:6px}
h1{font-size:24px;font-weight:650;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 22px;max-width:74ch}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:600}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:840px){.stage{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  padding:14px 14px 10px;box-shadow:var(--shadow)}
.card h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin:0 0 10px;font-weight:650}
canvas{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:12.5px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;
  vertical-align:-1px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:2px 14px;
  margin-top:12px;font-variant-numeric:tabular-nums}
.readout div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;
  border-bottom:1px solid var(--grid);font-size:12.5px}
.readout span:first-child{color:var(--faint)}
.readout span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:16px;
  background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ground);background:var(--ink);
  border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{opacity:.85}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.step{background:transparent;color:var(--ink);border:1px solid var(--edge);
  font-family:ui-monospace,Menlo,monospace;padding:7px 12px}
.step:hover{background:var(--grid);opacity:1}
input[type=range]{flex:1;min-width:160px;accent-color:var(--a)}
.spd{display:flex;gap:4px}
.spd button{background:transparent;color:var(--dim);border:1px solid var(--edge);
  padding:5px 10px;font-size:12px}
.spd button[aria-pressed=true]{background:var(--a);color:var(--ground);border-color:var(--a)}
.tstamp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  color:var(--dim);font-variant-numeric:tabular-nums;min-width:96px}
.note{margin-top:24px;color:var(--dim);font-size:13px;max-width:70ch}
.note b{color:var(--ink);font-weight:620}
.note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--grid);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <h1>__TITLE__</h1>
  <span class="eyebrow">__EYEBROW__</span>
</header>
<p class="sub">
__SUB__
</p>

<div class="stage">
  <div class="card">
    <h2>合成波形 — 各々の中心位相を 0° に揃えて重ねる</h2>
    <canvas id="wf" width="1000" height="560" aria-label="A と B の合成波形"></canvas>
    <div class="legend">
      <span><i style="background:var(--a)"></i>A の合成波形</span>
      <span><i style="background:var(--b)"></i>B の合成波形</span>
      <span style="color:var(--faint)">細線＝包絡　A・B・全時刻を共通係数で正規化</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <h2>相対位相の変位 — 振り子として</h2>
      <canvas id="pend" width="1000" height="560" aria-label="相対位相を振り子で表す"></canvas>
      <div class="legend">
        <span><i style="background:var(--a)"></i>A</span>
        <span><i style="background:var(--b)"></i>B</span>
        <span style="color:var(--faint)">○ は固定サイズ（大きさは量を表さない）</span>
      </div>
    </div>
    <div class="card">
      <h2>Δθ の時系列（直近 120 步）</h2>
      <canvas id="ts" width="1000" height="230" aria-label="相対位相の時系列"></canvas>
    </div>
  </div>
</div>

<div class="card" style="margin-top:18px">
  <div class="readout" id="ro"></div>
</div>

<div class="controls">
  <button id="play">一時停止</button>
  <button class="step" id="m10">−10</button>
  <button class="step" id="m1">−1</button>
  <button class="step" id="p1">+1</button>
  <button class="step" id="p10">+10</button>
  <input type="range" id="scrub" min="0" value="0" aria-label="時刻">
  <span class="tstamp" id="tt">τ = 0</span>
  <div class="spd" role="group" aria-label="速度">
    <button data-s="1" aria-pressed="true">×1</button>
    <button data-s="3">×3</button><button data-s="10">×10</button>
  </div>
</div>

<p class="note">
__NOTE__
</p>
</div>

<script>
const D = __DATA__;
const CHI=D.chi, DCHI=D.dchi, R=D.r, V=D.v, OM=D.omega,
      CRE=D.cloRe, CIM=D.cloIm, PA=D.PA, PB=D.PB, ZA=D.za, ZB=D.zb,
      WA=D.waveA, WB=D.waveB, EA=D.envA, EB=D.envB, CFG=D.config;
const N = CHI.length, NK = WA[0].length;

let css={};
function readTokens(){
  const s=getComputedStyle(document.documentElement); css={};
  for(const k of ["ground","panel","edge","grid","ink","dim","faint","a","b","res","om"])
    css[k]=s.getPropertyValue("--"+k).trim();
}
readTokens();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readTokens();draw(cur);});

const mx=a=>Math.max(...a), mn=a=>Math.min(...a);
const CHI_MAX=Math.max(Math.abs(mn(CHI)),Math.abs(mx(CHI)));

function fit(cv){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth||cv.width, h=w*cv.height/cv.width;
  cv.style.height=h+"px";
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  return [g,w,h];
}

/* ---------- 合成波形 ---------- */
function drawWave(i){
  const [g,w,h]=fit(document.getElementById("wf"));
  g.clearRect(0,0,w,h);
  const L=44, Rr=14, T=16, B=34;
  const X=k=>L+(w-L-Rr)*k/(NK-1);
  const Y=v=>(h-B+T)/2+ (h-B-T)/2*(-v);      // v は −1..+1 想定
  // 目盛（χ は −180..+180）
  g.strokeStyle=css.grid; g.lineWidth=1; g.fillStyle=css.faint;
  g.font="11px system-ui"; g.textAlign="center"; g.textBaseline="top";
  for(let d=-180; d<=180; d+=60){
    const k=(d+180)/360*(NK-1), x=X(k);
    g.beginPath(); g.moveTo(x,T); g.lineTo(x,h-B); g.stroke();
    g.fillText(d+"°", x, h-B+6);
  }
  g.textAlign="right"; g.textBaseline="middle";
  for(const v of [-1,-0.5,0,0.5,1]){
    const y=Y(v);
    g.strokeStyle = v===0?css.edge:css.grid; g.lineWidth=1;
    g.beginPath(); g.moveTo(L,y); g.lineTo(w-Rr,y); g.stroke();
    g.fillStyle=css.faint; g.fillText(v.toFixed(1), L-6, y);
  }
  g.textAlign="center"; g.textBaseline="top";
  g.fillStyle=css.faint; g.fillText("中心位相からのずれ χ", (L+w-Rr)/2, h-B+20);
  // 包絡（細線・±）
  for(const [E,c] of [[EA[i],css.a],[EB[i],css.b]]){
    for(const sg of [1,-1]){
      g.strokeStyle=c; g.lineWidth=1; g.globalAlpha=.42; g.beginPath();
      for(let k=0;k<NK;k++){ const x=X(k), y=Y(sg*E[k]); k?g.lineTo(x,y):g.moveTo(x,y); }
      g.stroke(); g.globalAlpha=1;
    }
  }
  // 合成波形（太線）
  for(const [W,c] of [[WB[i],css.b],[WA[i],css.a]]){
    g.strokeStyle=c; g.lineWidth=2.2; g.lineJoin="round"; g.beginPath();
    for(let k=0;k<NK;k++){ const x=X(k), y=Y(W[k]); k?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  }
}

/* ---------- 振り子 ---------- */
function drawPend(i){
  const [g,w,h]=fit(document.getElementById("pend"));
  g.clearRect(0,0,w,h);
  const cx=w/2, cy=h*0.30, L=Math.min(w,h)*0.42, chi=CHI[i];
  g.strokeStyle=css.grid; g.lineWidth=1.5;
  g.beginPath(); g.arc(cx,cy,L,Math.PI/2-60*Math.PI/180,Math.PI/2+60*Math.PI/180); g.stroke();
  const t=Math.PI/2+chi, px=cx+Math.cos(t)*L, py=cy+Math.sin(t)*L;
  const t2=Math.PI/2-chi, qx=cx+Math.cos(t2)*L, qy=cy+Math.sin(t2)*L;
  g.strokeStyle=css.dim; g.lineWidth=1; g.globalAlpha=.5;
  g.beginPath(); g.moveTo(cx,cy); g.lineTo(px,py); g.moveTo(cx,cy); g.lineTo(qx,qy);
  g.stroke(); g.globalAlpha=1;
  g.fillStyle=css.dim; g.beginPath(); g.arc(cx,cy,5,0,7); g.fill();
  const RAD=13;                       // ★固定サイズ。大きさは量を表さない
  g.textAlign="center";
  for(const [x,y,c,lab] of [[px,py,css.a,"A"],[qx,qy,css.b,"B"]]){
    g.fillStyle=c; g.globalAlpha=.16;
    g.beginPath(); g.arc(x,y,RAD,0,7); g.fill(); g.globalAlpha=1;
    g.strokeStyle=c; g.lineWidth=2; g.beginPath(); g.arc(x,y,RAD,0,7); g.stroke();
    g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();
    g.font="600 13px system-ui"; g.fillText(lab,x,y-RAD-8);
  }
  g.fillStyle=css.ink; g.font="600 16px ui-monospace,Menlo,monospace";
  g.fillText((chi*180/Math.PI).toFixed(3)+"°", cx, cy+L*1.34);
  g.fillStyle=css.faint; g.font="11px system-ui";
  g.fillText("Δθ", cx, cy+L*1.34+18);
}

/* ---------- 時系列 ---------- */
function drawTS(i){
  const [g,w,h]=fit(document.getElementById("ts"));
  g.clearRect(0,0,w,h);
  const L=44,Rr=12,T=10,B=18, W=120, s=Math.max(0,i-W+1);
  const X=j=>L+(w-L-Rr)*(j-s)/(W-1);
  const Y=v=>T+(h-T-B)*(0.5-0.5*v/CHI_MAX);
  g.strokeStyle=css.grid; g.lineWidth=1;
  g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(w-Rr,Y(0)); g.stroke();
  g.strokeStyle=css.a; g.lineWidth=1.8; g.beginPath();
  for(let j=s;j<=i;j++){ const x=X(j),y=Y(CHI[j]); j===s?g.moveTo(x,y):g.lineTo(x,y); }
  g.stroke();
  g.fillStyle=css.a; g.beginPath(); g.arc(X(i),Y(CHI[i]),4,0,7); g.fill();
  g.fillStyle=css.faint; g.font="11px system-ui"; g.textAlign="right";
  g.fillText("±"+(CHI_MAX*180/Math.PI).toFixed(0)+"°", L-6, T+8);
}

/* ---------- 読出し ---------- */
const rows=["Δθ","dΔθ/dτ","反射率 r","P_A","P_B","|z_A|","|z_B|","ω","v","Σz² 実部","Σz² 虚部"];
const ro=document.getElementById("ro"); const vs=[];
for(const k of rows){
  const d=document.createElement("div");
  d.innerHTML="<span>"+k+"</span><span></span>"; ro.appendChild(d);
  vs.push(d.lastElementChild);
}
function drawRO(i){
  const f=(x,n)=>Number(x).toFixed(n);
  vs[0].textContent=f(CHI[i]*180/Math.PI,3)+"°";
  vs[1].textContent=f(DCHI[i]*180/Math.PI,3)+"°/步";
  vs[2].textContent=f(R[i],6);
  vs[3].textContent=f(PA[i],6); vs[4].textContent=f(PB[i],6);
  vs[5].textContent=f(ZA[i],6); vs[6].textContent=f(ZB[i],6);
  vs[7].textContent=f(OM[i],6); vs[8].textContent=Number(V[i]).toExponential(3);
  vs[9].textContent=Number(CRE[i]).toExponential(2);
  vs[10].textContent=Number(CIM[i]).toExponential(2);
}

let cur=0, playing=true, spd=1;
function draw(i){ drawWave(i); drawPend(i); drawTS(i); drawRO(i);
  document.getElementById("tt").textContent="τ = "+i;
  document.getElementById("scrub").value=i; }
const scrub=document.getElementById("scrub"); scrub.max=N-1;
scrub.addEventListener("input",e=>{cur=+e.target.value;playing=false;
  document.getElementById("play").textContent="再生";draw(cur);});
function jump(d){ cur=(cur+d+N)%N; playing=false;
  document.getElementById("play").textContent="再生"; draw(cur); }
document.getElementById("m1").onclick=()=>jump(-1);
document.getElementById("p1").onclick=()=>jump(1);
document.getElementById("m10").onclick=()=>jump(-10);
document.getElementById("p10").onclick=()=>jump(10);
document.getElementById("play").onclick=e=>{playing=!playing;
  e.target.textContent=playing?"一時停止":"再生";};
document.querySelectorAll(".spd button").forEach(b=>b.onclick=()=>{
  spd=+b.dataset.s;
  document.querySelectorAll(".spd button").forEach(x=>x.setAttribute("aria-pressed",x===b));
});
addEventListener("keydown",ev=>{
  if(ev.key==="ArrowRight"){jump(1);ev.preventDefault();}
  if(ev.key==="ArrowLeft"){jump(-1);ev.preventDefault();}
});
if(matchMedia("(prefers-reduced-motion: reduce)").matches) playing=false;
addEventListener("resize",()=>draw(cur));
let acc=0;
function loop(){ if(playing){ acc+=spd; while(acc>=1){cur=(cur+1)%N;acc-=1;} draw(cur); }
  requestAnimationFrame(loop); }
draw(0); loop();
</script>
