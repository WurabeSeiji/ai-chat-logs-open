<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="white"/>
  <text x="600" y="45" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">N=2 のネットワーク構造</text>

  <text x="280" y="95" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">(a) 通常の完全グラフ K₂</text>
  <circle cx="150" cy="250" r="42" fill="white" stroke="#222" stroke-width="4"/>
  <circle cx="410" cy="250" r="42" fill="white" stroke="#222" stroke-width="4"/>
  <text x="150" y="260" text-anchor="middle" font-family="sans-serif" font-size="28">v₁</text>
  <text x="410" y="260" text-anchor="middle" font-family="sans-serif" font-size="28">v₂</text>
  <line x1="192" y1="250" x2="368" y2="250" stroke="#222" stroke-width="5"/>
  <text x="280" y="225" text-anchor="middle" font-family="sans-serif" font-size="23">1 relation</text>
  <text x="280" y="330" text-anchor="middle" font-family="sans-serif" font-size="22">2頂点・1辺：閉路を持たない</text>

  <line x1="600" y1="90" x2="600" y2="450" stroke="#bbb" stroke-width="2"/>

  <text x="900" y="95" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">(b) 二波ゼロ閉塞の最小ループ</text>
  <circle cx="760" cy="250" r="42" fill="white" stroke="#222" stroke-width="4"/>
  <circle cx="1040" cy="250" r="42" fill="white" stroke="#222" stroke-width="4"/>
  <text x="760" y="260" text-anchor="middle" font-family="sans-serif" font-size="28">v₁</text>
  <text x="1040" y="260" text-anchor="middle" font-family="sans-serif" font-size="28">v₂</text>

  <path d="M800,225 C860,145 940,145 1000,225" fill="none" stroke="#222" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1000,275 C940,355 860,355 800,275" fill="none" stroke="#222" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="900" y="150" text-anchor="middle" font-family="sans-serif" font-size="24">z₁</text>
  <text x="900" y="385" text-anchor="middle" font-family="sans-serif" font-size="24">z₂ = ± i z₁</text>
  <text x="900" y="435" text-anchor="middle" font-family="sans-serif" font-size="22">2頂点・2関係：向き付き閉ループ</text>
  <text x="900" y="475" text-anchor="middle" font-family="sans-serif" font-size="20">z₁² + z₂² = 0</text>
</svg>
