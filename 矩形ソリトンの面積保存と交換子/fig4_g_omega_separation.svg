<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="sans-serif">
<title>The log map separates scale g from quantization omega</title>
<desc>Under the logarithmic map, the scale g is factored out as a privileged scale C (gauge), while the quantization omega, the half-bit fluctuation, is left invariant on the flat surface. The map is fully invertible; no full symmetry is required.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="160" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">nu space (before)</text>
<text x="540" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">N space (after log map)</text>
<circle cx="160" cy="175" r="78" fill="none" stroke="#185FA5" stroke-width="1.4"/>
<text x="160" y="172" text-anchor="middle" font-size="12" fill="#0C447C">g = sum nu^2</text>
<text x="160" y="190" text-anchor="middle" font-size="12" fill="#0C447C">(curved scale)</text>
<circle cx="224" cy="130" r="4" fill="#993C1D"/>
<circle cx="206" cy="112" r="4" fill="#993C1D"/>
<line x1="224" y1="130" x2="206" y2="112" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="244" y="104" text-anchor="start" font-size="12" fill="#993C1D">omega = d1 d2 = 1/2</text>
<line x1="268" y1="175" x2="408" y2="175" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="338" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">N = log2 nu</text>
<line x1="460" y1="235" x2="620" y2="235" stroke="#185FA5" stroke-width="1.6"/>
<text x="540" y="257" text-anchor="middle" font-size="12" fill="#0C447C">g factored out as scale C (gauge)</text>
<circle cx="540" cy="235" r="5" fill="#185FA5"/>
<circle cx="540" cy="145" r="4" fill="#993C1D"/>
<circle cx="540" cy="185" r="4" fill="#993C1D"/>
<line x1="540" y1="145" x2="540" y2="185" stroke="#993C1D" stroke-width="0.8"/>
<text x="552" y="143" text-anchor="start" font-size="12" fill="#993C1D">+1/2</text>
<text x="552" y="191" text-anchor="start" font-size="12" fill="#993C1D">-1/2</text>
<text x="552" y="169" text-anchor="start" font-size="12" fill="#993C1D">omega invariant</text>
<rect x="60" y="312" width="560" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">g (scale) factored out as privileged C (gauge); omega (quantization) stays invariant</text>
<text x="340" y="362" text-anchor="middle" font-size="12" fill="#5F5E5A">the log map carries both; the scale g is gauge, the half-bit omega is scale-invariant</text>
<text x="340" y="380" text-anchor="middle" font-size="12" fill="#5F5E5A">flattening is separation, not loss of information</text>
</svg>
