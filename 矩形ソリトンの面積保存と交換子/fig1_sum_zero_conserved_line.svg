<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="sans-serif">
<title>Sum-zero fluctuation on the conserved line N_a + N_b = K</title>
<desc>On the line N_a plus N_b equals K, a half-bit fluctuation moves the point by plus one half along one axis and minus one half along the other, keeping the sum constant.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="80" y1="380" x2="600" y2="380" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="80" y1="380" x2="80" y2="60" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="600" y="402" text-anchor="middle" font-size="12" fill="#5F5E5A">N_a</text>
<text x="80" y="46" text-anchor="middle" font-size="12" fill="#5F5E5A">N_b</text>

<line x1="140" y1="140" x2="540" y2="340" stroke="#185FA5" stroke-width="1.6"/>
<text x="548" y="330" text-anchor="start" font-size="12" fill="#0C447C">N_a + N_b = K</text>

<line x1="300" y1="280" x2="380" y2="240" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>

<circle cx="340" cy="260" r="4" fill="#185FA5"/>
<text x="340" y="244" text-anchor="middle" font-size="12" fill="#0C447C">(N_a, N_b)</text>

<circle cx="300" cy="280" r="4" fill="#993C1D"/>
<circle cx="380" cy="240" r="4" fill="#993C1D"/>

<line x1="340" y1="300" x2="300" y2="300" stroke="#993C1D" stroke-width="0.8"/>
<line x1="300" y1="300" x2="300" y2="286" stroke="#993C1D" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="318" y="320" text-anchor="middle" font-size="12" fill="#993C1D">Δ_a = −1/2</text>

<line x1="340" y1="220" x2="380" y2="220" stroke="#993C1D" stroke-width="0.8"/>
<line x1="380" y1="220" x2="380" y2="234" stroke="#993C1D" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="362" y="212" text-anchor="middle" font-size="12" fill="#993C1D">Δ_b = +1/2</text>

<rect x="380" y="120" width="230" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="495" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Δ_a + Δ_b = 0</text>
<text x="495" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">point stays on the line</text>
<text x="495" y="188" text-anchor="middle" font-size="12" fill="#5F5E5A">sum N_a + N_b = K conserved</text>
</svg>
