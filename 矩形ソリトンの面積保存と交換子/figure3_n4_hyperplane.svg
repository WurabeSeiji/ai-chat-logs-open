<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="520" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 3.  n = 4 :  a 3-D hyperplane (3-dimensional)</text>
  <text x="260" y="56" text-anchor="middle" font-size="13" fill="#555">Additive identity  N&#8321; + N&#8322; + N&#8323; + N&#8324; = K , shown as a 3-D projection</text>

  <!-- The positive-region of the hyperplane is a tetrahedron (3-simplex). -->
  <!-- Four vertices = the four axis intercepts (K,0,0,0),(0,K,0,0),(0,0,K,0),(0,0,0,K). -->
  <!-- Draw a tetrahedron in oblique projection. -->

  <!-- vertices on screen -->
  <!-- A (top)      = 250,110 -->
  <!-- B (front-left)= 130,330 -->
  <!-- C (front-right)=370,330 -->
  <!-- D (back)     = 255,250  -->

  <!-- faces (translucent) -->
  <!-- front face A-B-C -->
  <polygon points="250,110 130,330 370,330" fill="#c0392b" fill-opacity="0.13" stroke="#c0392b" stroke-width="2.2"/>
  <!-- left face A-B-D -->
  <polygon points="250,110 130,330 255,250" fill="#c0392b" fill-opacity="0.07" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- right face A-C-D -->
  <polygon points="250,110 370,330 255,250" fill="#c0392b" fill-opacity="0.07" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- bottom face B-C-D -->
  <polygon points="130,330 370,330 255,250" fill="#c0392b" fill-opacity="0.05" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- edges solid (visible) re-drawn for crispness -->
  <g stroke="#c0392b" stroke-width="2.2" fill="none">
    <line x1="250" y1="110" x2="130" y2="330"/>
    <line x1="250" y1="110" x2="370" y2="330"/>
    <line x1="130" y1="330" x2="370" y2="330"/>
  </g>
  <!-- hidden edge to back vertex (dashed) -->
  <g stroke="#c0392b" stroke-width="1.6" fill="none" stroke-dasharray="4 3">
    <line x1="250" y1="110" x2="255" y2="250"/>
    <line x1="130" y1="330" x2="255" y2="250"/>
    <line x1="370" y1="330" x2="255" y2="250"/>
  </g>

  <!-- vertices -->
  <circle cx="250" cy="110" r="4.5" fill="#c0392b"/>
  <circle cx="130" cy="330" r="4.5" fill="#c0392b"/>
  <circle cx="370" cy="330" r="4.5" fill="#c0392b"/>
  <circle cx="255" cy="250" r="4.5" fill="#c0392b"/>

  <!-- vertex labels (the four axis intercepts) -->
  <text x="250" y="100" font-size="11.5" fill="#1a1a1a" text-anchor="middle">(K,0,0,0)</text>
  <text x="120" y="348" font-size="11.5" fill="#1a1a1a" text-anchor="end">(0,K,0,0)</text>
  <text x="380" y="348" font-size="11.5" fill="#1a1a1a" text-anchor="start">(0,0,K,0)</text>
  <text x="268" y="246" font-size="11.5" fill="#1a1a1a" text-anchor="start">(0,0,0,K)</text>

  <!-- equation label -->
  <text x="250" y="300" font-size="14.5" fill="#c0392b" font-weight="bold" text-anchor="middle">N&#8321;+N&#8322;+N&#8323;+N&#8324; = K</text>

  <!-- note -->
  <text x="260" y="420" text-anchor="middle" font-size="12.5" fill="#333">The positive region is a tetrahedron (3-simplex).</text>
  <text x="260" y="440" text-anchor="middle" font-size="12" fill="#555">A 3-dimensional hyperplane in 4-D space ; three degrees of freedom.</text>
  <text x="260" y="462" text-anchor="middle" font-size="11.5" fill="#888">(n = 4 is shown only as an example; no special role is claimed.)</text>
</svg>
