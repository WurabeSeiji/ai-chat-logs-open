<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="sans-serif">
<title>Constant product a times b equals constant in observable space</title>
<desc>In observable space the conserved relation is the hyperbola a times b equals a constant; tightening one variable widens the other while the product stays fixed.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="80" y1="380" x2="600" y2="380" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="80" y1="380" x2="80" y2="60" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="600" y="402" text-anchor="middle" font-size="12" fill="#5F5E5A">a</text>
<text x="80" y="46" text-anchor="middle" font-size="12" fill="#5F5E5A">b</text>

<path d="M120 350 C 200 150, 260 110, 540 95" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<text x="548" y="99" text-anchor="start" font-size="12" fill="#0C447C">a · b = 2^K</text>

<circle cx="180" cy="215" r="4" fill="#993C1D"/>
<line x1="180" y1="215" x2="180" y2="380" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="180" y1="215" x2="80" y2="215" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="190" y="205" text-anchor="start" font-size="12" fill="#993C1D">small a, large b</text>

<circle cx="360" cy="120" r="4" fill="#993C1D"/>
<line x1="360" y1="120" x2="360" y2="380" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="360" y1="120" x2="80" y2="120" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="370" y="120" text-anchor="start" font-size="12" fill="#993C1D">large a, small b</text>

<rect x="378" y="260" width="232" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="494" y="288" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">a · b = 2^K</text>
<text x="494" y="310" text-anchor="middle" font-size="12" fill="#5F5E5A">tighten one, the other widens</text>
<text x="494" y="328" text-anchor="middle" font-size="12" fill="#5F5E5A">image of Δ_a + Δ_b = 0</text>
</svg>
