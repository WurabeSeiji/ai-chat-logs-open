<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" font-family="sans-serif">
<title>Complex structure from two real components</title>
<desc>Two real axes nu-one and nu-two carry a point z. The radius nu equals the square root of the sum of squares g and is invariant under rotation; the product omega equals nu-one times nu-two and varies with the angle. The pair corresponds to the complex number z equals nu times e to the i theta.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="60" y1="300" x2="430" y2="300" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="245" y1="430" x2="245" y2="70" stroke="#444441" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="430" y="320" text-anchor="middle" font-size="12" fill="#5F5E5A">ν₁ (real part)</text>
<text x="245" y="58" text-anchor="middle" font-size="12" fill="#5F5E5A">ν₂ (imag part)</text>

<circle cx="245" cy="300" r="120" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3"/>
<text x="245" y="170" text-anchor="middle" font-size="12" fill="#0C447C">g = ν₁² + ν₂² = |z|² (invariant)</text>

<line x1="245" y1="300" x2="330" y2="215" stroke="#534AB7" stroke-width="1.6"/>
<circle cx="330" cy="215" r="4" fill="#534AB7"/>
<text x="338" y="210" text-anchor="start" font-size="14" font-weight="500" fill="#3C3489">z = ν e^{iθ}</text>

<path d="M285 300 A 40 40 0 0 0 274 272" fill="none" stroke="#993C1D" stroke-width="0.8"/>
<text x="298" y="288" text-anchor="middle" font-size="12" fill="#993C1D">θ</text>

<text x="280" y="252" text-anchor="middle" font-size="12" fill="#3C3489" transform="rotate(-45 280 252)">ν = √g</text>

<line x1="330" y1="215" x2="330" y2="300" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="330" y1="215" x2="245" y2="215" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="335" y="262" text-anchor="start" font-size="12" fill="#993C1D">ν₁</text>
<text x="285" y="210" text-anchor="middle" font-size="12" fill="#993C1D">ν₂</text>

<rect x="455" y="150" width="200" height="120" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="555" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">real two-component</text>
<text x="555" y="202" text-anchor="middle" font-size="12" fill="#5F5E5A">g = ν₁²+ν₂² → |z|²</text>
<text x="555" y="222" text-anchor="middle" font-size="12" fill="#5F5E5A">ω = δ₁δ₂ → imag side (area)</text>
<text x="555" y="242" text-anchor="middle" font-size="12" fill="#5F5E5A">cos↔sin → J (i times)</text>
<text x="555" y="262" text-anchor="middle" font-size="12" fill="#5F5E5A">i = rotation J (J² = −1)</text>
</svg>
