<svg xmlns="http://www.w3.org/2000/svg" width="520" height="480" viewBox="0 0 520 480" font-family="Georgia, 'Times New Roman', serif">
  <rect width="520" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 2.  n = 3 :  a plane (2-dimensional)</text>
  <text x="260" y="56" text-anchor="middle" font-size="13" fill="#555">Additive identity  N&#8321; + N&#8322; + N&#8323; = K  in (N&#8321;, N&#8322;, N&#8323;) space</text>

  <!-- 3D axes drawn from a common origin O at (170,360) -->
  <!-- N3 up, N1 to right, N2 to back-left (oblique) -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- origin -->
  <!-- O = (170,360) -->
  <!-- N1 axis: to the right  -> (430,360) -->
  <!-- N3 axis: straight up    -> (170,110) -->
  <!-- N2 axis: oblique up-left-> (70,250) -->

  <!-- triangle (the plane region in the positive octant): vertices on each axis -->
  <!-- choose intercepts: on N1 at (350,360); on N3 at (170,170); on N2 at (95,285) -->
  <polygon points="350,360 170,170 95,285" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="2.4"/>

  <!-- axes (drawn over translucent triangle) -->
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="170" y1="360" x2="430" y2="360" marker-end="url(#arrow2)"/>
    <line x1="170" y1="360" x2="170" y2="105" marker-end="url(#arrow2)"/>
    <line x1="170" y1="360" x2="66"  y2="246" marker-end="url(#arrow2)"/>
  </g>

  <!-- origin dot + label -->
  <circle cx="170" cy="360" r="3" fill="#1a1a1a"/>
  <text x="162" y="378" font-size="12" fill="#777" text-anchor="end">O</text>

  <!-- axis labels -->
  <text x="438" y="364" font-size="15" font-style="italic" fill="#1a1a1a">N&#8321;</text>
  <text x="168" y="100" font-size="15" font-style="italic" fill="#1a1a1a" text-anchor="middle">N&#8323;</text>
  <text x="56"  y="240" font-size="15" font-style="italic" fill="#1a1a1a" text-anchor="end">N&#8322;</text>

  <!-- intercept points -->
  <circle cx="350" cy="360" r="4" fill="#c0392b"/>
  <circle cx="170" cy="170" r="4" fill="#c0392b"/>
  <circle cx="95"  cy="285" r="4" fill="#c0392b"/>
  <text x="350" y="380" font-size="11.5" fill="#c0392b" text-anchor="middle">(K,0,0)</text>
  <text x="182" y="168" font-size="11.5" fill="#c0392b">(0,0,K)</text>
  <text x="60"  y="298" font-size="11.5" fill="#c0392b" text-anchor="end">(0,K,0)</text>

  <!-- equation label inside triangle -->
  <text x="205" y="278" font-size="14.5" fill="#c0392b" font-weight="bold" text-anchor="middle">N&#8321;+N&#8322;+N&#8323; = K</text>

  <!-- note -->
  <text x="260" y="455" text-anchor="middle" font-size="12" fill="#555">a planar triangle in the positive octant ; two degrees of freedom</text>
</svg>
