<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="sans-serif">
<title>Nodes on a closed system generate discreteness</title>
<desc>On a closed loop the binary plus and minus regions alternate. Each switch from plus to minus is a node. Because the loop closes back to plus, the nodes are even in number, and they are discrete points, which is the root of discreteness.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="200" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">closed loop with binary +/-</text>

<circle cx="200" cy="210" r="120" fill="none" stroke="#5F5E5A" stroke-width="1"/>

<path d="M 200 90 A 120 120 0 0 1 320 210" fill="none" stroke="#185FA5" stroke-width="3"/>
<path d="M 320 210 A 120 120 0 0 1 200 330" fill="none" stroke="#993C1D" stroke-width="3"/>
<path d="M 200 330 A 120 120 0 0 1 80 210" fill="none" stroke="#185FA5" stroke-width="3"/>
<path d="M 80 210 A 120 120 0 0 1 200 90" fill="none" stroke="#993C1D" stroke-width="3"/>

<text x="270" y="150" text-anchor="middle" font-size="14" fill="#0C447C">+</text>
<text x="270" y="280" text-anchor="middle" font-size="14" fill="#993C1D">-</text>
<text x="130" y="280" text-anchor="middle" font-size="14" fill="#0C447C">+</text>
<text x="130" y="150" text-anchor="middle" font-size="14" fill="#993C1D">-</text>

<circle cx="200" cy="90" r="5" fill="#2C2C2A"/>
<circle cx="320" cy="210" r="5" fill="#2C2C2A"/>
<circle cx="200" cy="330" r="5" fill="#2C2C2A"/>
<circle cx="80" cy="210" r="5" fill="#2C2C2A"/>

<text x="200" y="80" text-anchor="middle" font-size="12" fill="#2C2C2A">node</text>
<text x="340" y="214" text-anchor="start" font-size="12" fill="#2C2C2A">node</text>
<text x="200" y="352" text-anchor="middle" font-size="12" fill="#2C2C2A">node</text>
<text x="60" y="214" text-anchor="end" font-size="12" fill="#2C2C2A">node</text>

<rect x="400" y="120" width="240" height="170" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="520" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">why nodes give discreteness</text>
<text x="520" y="178" text-anchor="middle" font-size="12" fill="#5F5E5A">binary (+/-) creates a node</text>
<text x="520" y="198" text-anchor="middle" font-size="12" fill="#5F5E5A">at each +/- switch</text>
<text x="520" y="222" text-anchor="middle" font-size="12" fill="#5F5E5A">nodes are points = discrete</text>
<text x="520" y="246" text-anchor="middle" font-size="12" fill="#5F5E5A">anonymity = integer count</text>
<text x="520" y="270" text-anchor="middle" font-size="12" fill="#5F5E5A">closed loop = even count</text>
</svg>
