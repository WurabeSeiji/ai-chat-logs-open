<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460" viewBox="0 0 520 460" font-family="Georgia, 'Times New Roman', serif">
  <rect width="520" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 1.  n = 2 :  a line (1-dimensional)</text>
  <text x="260" y="56" text-anchor="middle" font-size="13" fill="#555">Additive identity  N&#8321; + N&#8322; = K  in the (N&#8321;, N&#8322;) plane</text>

  <!-- plot area origin at (90,400), axes -->
  <!-- grid -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="90" y1="100" x2="450" y2="100"/>
    <line x1="90" y1="160" x2="450" y2="160"/>
    <line x1="90" y1="220" x2="450" y2="220"/>
    <line x1="90" y1="280" x2="450" y2="280"/>
    <line x1="90" y1="340" x2="450" y2="340"/>
    <line x1="150" y1="80" x2="150" y2="400"/>
    <line x1="210" y1="80" x2="210" y2="400"/>
    <line x1="270" y1="80" x2="270" y2="400"/>
    <line x1="330" y1="80" x2="330" y2="400"/>
    <line x1="390" y1="80" x2="390" y2="400"/>
  </g>

  <!-- axes -->
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="90" y1="400" x2="470" y2="400" marker-end="url(#arrow)"/>
    <line x1="90" y1="400" x2="90" y2="78"  marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- axis labels -->
  <text x="478" y="404" font-size="15" font-style="italic" fill="#1a1a1a">N&#8321;</text>
  <text x="78"  y="74"  font-size="15" font-style="italic" fill="#1a1a1a" text-anchor="end">N&#8322;</text>
  <text x="84"  y="416" font-size="12" fill="#777" text-anchor="end">0</text>

  <!-- the line N1 + N2 = K  : choose K so endpoints on axes at (360,0)->screen(390,400) and (0,360)->screen(90,40-ish) -->
  <!-- map: screen_x = 90 + N1, screen_y = 400 - N2 ; K=300 -> intercepts (300,0) and (0,300) -->
  <line x1="390" y1="400" x2="90" y2="100" stroke="#c0392b" stroke-width="2.6"/>

  <!-- intercept points -->
  <circle cx="390" cy="400" r="4" fill="#c0392b"/>
  <circle cx="90"  cy="100" r="4" fill="#c0392b"/>
  <text x="392" y="392" font-size="12" fill="#c0392b">(K, 0)</text>
  <text x="98"  y="104" font-size="12" fill="#c0392b">(0, K)</text>

  <!-- equation label on the line -->
  <text x="232" y="232" font-size="15" fill="#c0392b" font-weight="bold" transform="rotate(-45 232 232)" text-anchor="middle">N&#8321; + N&#8322; = K</text>

  <!-- slope note -->
  <text x="300" y="440" text-anchor="middle" font-size="12" fill="#555">a line of slope &#8722;1 ; one degree of freedom</text>
</svg>
