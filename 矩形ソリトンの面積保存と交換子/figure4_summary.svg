<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Figure 4.  Dimensional lift of the additive hyperplane &#931;N&#7522; = K</text>
  <text x="320" y="50" text-anchor="middle" font-size="12.5" fill="#555">From a single axis (n = 1) to a 3-D hyperplane (n = 4) ; the structure of dimension (n &#8722; 1) rises with n.</text>

  <!-- four panels -->
  <!-- panel boxes centers: 90, 250, 410, 560 ; y around 150 -->

  <!-- ===== Panel n=1 : axis (point/line) ===== -->
  <g>
    <line x1="40" y1="170" x2="150" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
    <circle cx="65"  cy="170" r="3" fill="#c0392b"/>
    <circle cx="95"  cy="170" r="3" fill="#c0392b"/>
    <circle cx="125" cy="170" r="3" fill="#c0392b"/>
    <text x="95" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">n = 1</text>
    <text x="95" y="200" text-anchor="middle" font-size="11.5" fill="#c0392b">axis</text>
    <text x="95" y="216" text-anchor="middle" font-size="11" fill="#555">N = log&#8322;&#957;</text>
    <text x="95" y="246" text-anchor="middle" font-size="11.5" fill="#1a1a1a">dim 1</text>
  </g>

  <!-- ===== Panel n=2 : line ===== -->
  <g>
    <!-- small axes -->
    <line x1="200" y1="195" x2="300" y2="195" stroke="#bbb" stroke-width="1"/>
    <line x1="210" y1="205" x2="210" y2="115" stroke="#bbb" stroke-width="1"/>
    <!-- the line -->
    <line x1="285" y1="195" x2="210" y2="125" stroke="#c0392b" stroke-width="2.4"/>
    <text x="250" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">n = 2</text>
    <text x="250" y="222" text-anchor="middle" font-size="11.5" fill="#c0392b">line</text>
    <text x="250" y="238" text-anchor="middle" font-size="10.5" fill="#555">N&#8321;+N&#8322;=K</text>
    <text x="250" y="262" text-anchor="middle" font-size="11.5" fill="#1a1a1a">dim 1</text>
  </g>

  <!-- ===== Panel n=3 : plane (triangle) ===== -->
  <g>
    <!-- small oblique axes -->
    <line x1="360" y1="195" x2="455" y2="195" stroke="#bbb" stroke-width="1"/>
    <line x1="370" y1="200" x2="370" y2="120" stroke="#bbb" stroke-width="1"/>
    <line x1="370" y1="195" x2="338" y2="163" stroke="#bbb" stroke-width="1"/>
    <!-- triangle -->
    <polygon points="440,190 372,128 345,170" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="2.1"/>
    <text x="405" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">n = 3</text>
    <text x="405" y="222" text-anchor="middle" font-size="11.5" fill="#c0392b">plane</text>
    <text x="405" y="238" text-anchor="middle" font-size="10.5" fill="#555">N&#8321;+N&#8322;+N&#8323;=K</text>
    <text x="405" y="262" text-anchor="middle" font-size="11.5" fill="#1a1a1a">dim 2</text>
  </g>

  <!-- ===== Panel n=4 : tetrahedron ===== -->
  <g>
    <!-- tetrahedron -->
    <polygon points="560,120 515,192 605,192" fill="#c0392b" fill-opacity="0.13" stroke="#c0392b" stroke-width="2"/>
    <polygon points="560,120 515,192 568,162" fill="#c0392b" fill-opacity="0.06" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3 2"/>
    <polygon points="560,120 605,192 568,162" fill="#c0392b" fill-opacity="0.06" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3 2"/>
    <g stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2" fill="none">
      <line x1="515" y1="192" x2="568" y2="162"/>
      <line x1="605" y1="192" x2="568" y2="162"/>
    </g>
    <text x="560" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">n = 4</text>
    <text x="560" y="222" text-anchor="middle" font-size="11.5" fill="#c0392b">hyperplane</text>
    <text x="560" y="238" text-anchor="middle" font-size="10.5" fill="#555">&#931;N&#7522;=K (i=1..4)</text>
    <text x="560" y="262" text-anchor="middle" font-size="11.5" fill="#1a1a1a">dim 3</text>
  </g>

  <!-- arrows between panels -->
  <g stroke="#999" stroke-width="1.4" fill="none">
    <line x1="158" y1="170" x2="192" y2="170" marker-end="url(#a4)"/>
    <line x1="312" y1="170" x2="346" y2="170" marker-end="url(#a4)"/>
    <line x1="468" y1="170" x2="502" y2="170" marker-end="url(#a4)"/>
  </g>
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- footer -->
  <text x="320" y="286" text-anchor="middle" font-size="10.5" fill="#666">Shape space after separating the privileged scale C = k^(1/n) ; only C is passed unchanged. Map fully invertible (no degeneration).</text>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#888">No physical interpretation, no special role of n = 4, and no necessity is claimed (illustration only).</text>
</svg>
